standard_version: 0.4.0-candidate
status: candidate
manifest_authority: canonical

purpose: >-
  Defines the authoritative public interoperability surface of the EAI Standard. Files outside this manifest may support documentation, evidence, examples, technical system description or implementation, but they do not redefine canonical semantics.

manifest_rule: >-
  This file is the single authoritative manifest for canonical EAI Standard artifacts. Governance documents and explanatory documentation MUST refer to this manifest rather than maintain an independent list of normative files.

canonical_artifacts:
  vocabulary:
    - definitions.yaml
    - relations.yaml
    - ai-actions.yaml
    - evidence-types.yaml
    - protection.yaml
    - diagnostics.yaml
    - identifiers.yaml
  rules:
    - rules.yaml
  conformance:
    - conformance-profiles.yaml
  normative_language:
    - normative-language.md
  schemas:
    - ../schemas/case.schema.json
    - ../schemas/adapter.schema.json
    - ../schemas/microstructure.schema.json
    - ../schemas/protection-assessment.schema.json
    - ../schemas/diagnostic.schema.json
    - ../schemas/conformance-result.schema.json
    - ../schemas/extension.schema.json

normative_language:
  keywords:
    - MUST
    - MUST NOT
    - REQUIRED
    - SHALL
    - SHALL NOT
    - SHOULD
    - SHOULD NOT
    - RECOMMENDED
    - NOT RECOMMENDED
    - MAY
    - OPTIONAL
  interpretation: BCP14
  references:
    - RFC2119
    - RFC8174
  rule: >-
    Capitalized requirement keywords are interpreted as described in BCP 14. Lower-case ordinary-language uses are not automatically normative requirements.

version_contract:
  standard_version: Identifies the EAI Standard release against which a canonical artifact is published.
  artifact_version: Optional version for a non-canonical or independently versioned artifact. It MUST NOT be substituted for standard_version.
  source_version: Version of an external source model represented by an adapter.
  profile_version: Version of an optional non-normative profile format or profile instance.
  deprecated_field: >-
    A generic top-level field named `version` is deprecated for canonical artifacts because it does not distinguish standard release from artifact revision.

identifier_policy:
  authority: identifiers.yaml
  canonical_id_rule: >-
    Canonical concepts intended for exchange MUST have a stable canonical identifier. Within candidate releases before 1.0 identifiers may still change, but changes MUST be explicit and accompanied by migration information.
  post_1_0_rule: >-
    After 1.0 a released canonical identifier MUST NOT be repurposed for incompatible semantics. A materially incompatible replacement requires a new identifier and deprecation of the old identifier.

stability_rules:
  - Canonical identifiers MUST remain unique within a released standard version.
  - A patch release MUST NOT change the meaning of a canonical identifier.
  - A minor release MAY add backward-compatible identifiers or optional fields.
  - Before 1.0 a breaking candidate change MAY occur only when explicitly documented in CHANGELOG.md with migration impact.
  - Registries, adapters, context profiles, system profiles and implementations MUST NOT silently redefine canonical terms.

non_canonical_layers:
  registries: reusable content that instantiates standard concepts
  adapters: source-preserving mappings to external models
  context: overlays for level, age, subject, curriculum, jurisdiction or externally defined requirements
  evidence: scientific support and claim maps
  system_profiles: optional technical descriptions of AI-system configuration and capability; never substitutes for observed AI-action analysis
  examples: non-normative worked cases
  implementations: software, UI, APIs and exports
  docs: human-readable explanation unless explicitly listed as canonical in this manifest

implementation_principle: >-
  Conforming implementations may expose only part of the public interface, but MUST identify which conformance profile and standard version they support and MUST NOT present unsupported canonical semantics as implemented.
