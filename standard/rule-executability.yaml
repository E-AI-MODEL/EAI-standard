classification_notes:
  EAI-R005: >-
    The case schema structurally separates human execution and AI actions, but determining whether AI output has been misrepresented as human performance can require evidence interpretation.
  EAI-R010: >-
    Handback fields are machine-readable, but whether AI materially performed or obscured the relevant core action and whether existing evidence is equivalent are contextual judgements.
  EAI-R012: >-
    Explicit unknown markers are machine-readable, but a validator cannot generally detect information that was silently omitted or coerced without contextual knowledge.
  EAI-R013: >-
    Multiple actors can be represented deterministically, but deciding whether both actors are materially relevant is contextual.
  EAI-R016: >-
    The prohibition is machine-checkable only once a canonical implementation-declaration contract represents aggregate-score dependence. That contract does not yet exist.
  EAI-R018: >-
    Structured evidence separates observation and interpretation, but deciding when that distinction materially affects judgement remains contextual.
  EAI-R023: >-
    AI-action identifiers are deterministic; whether an implementation treats an action as inherently permitted or prohibited is not currently encoded in a canonical field.
  EAI-R026: >-
    Detecting a claim that conformance proves educational effectiveness requires claim semantics not currently represented in a canonical machine-readable field.
  EAI-R031: >-
    Protection dimensions are structurally separate, but identical statuses across dimensions do not prove that a status was automatically propagated.

constraints:
  - An executability class MUST NOT be interpreted as a strength or importance ranking.
  - Machine classification assumes that the relevant canonical fields are present and does not authorise inference of missing information.
  - A rule MUST NOT be classified as machine merely because one part of it is schema-checkable.
  - Hybrid and human-review rules MUST preserve unresolved substantive judgements as uncertainty or explicit review requirements.
  - A validator implementation MUST NOT use an LLM or heuristic as hidden authority to convert a hybrid or human-review rule into a machine rule.
  - A future change in executability classification MUST NOT silently change the underlying normative rule.
