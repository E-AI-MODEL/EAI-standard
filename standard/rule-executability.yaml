standard_version: 0.4.0-candidate
status: candidate

purpose: >-
  Classifies canonical EAI rules by the degree to which a framework-agnostic validator may evaluate them from supplied structured data. This file does not change the meaning or authority of the rules. It constrains validator behaviour so implementation logic does not become hidden normative semantics.

classes:
  machine:
    description: The rule can be evaluated deterministically from canonical structured data and registries.
    validator_behaviour: A reference validator MAY emit a definitive conformance diagnostic when the required input is present.
  hybrid:
    description: Part of the rule can be checked deterministically, but a substantive contextual judgement may still be required.
    validator_behaviour: A validator MAY detect structural or explicit semantic conflicts, but MUST NOT invent the contextual judgement needed to complete the rule.
  human_review:
    description: Conformance depends materially on educational, professional, legal or contextual interpretation not derivable from canonical structured data alone.
    validator_behaviour: A validator MAY identify missing review or unresolved information, but MUST NOT manufacture the substantive judgement.

rules:
  EAI-R001: hybrid
  EAI-R002: machine
  EAI-R003: hybrid
