standard_version: 0.4.0-candidate
status: candidate
language: en

terms:
  context:
    definition: >-
      The concrete educational or professional situation in which human and AI actions are examined.
    required: true

  goal:
    definition: >-
      The intended educational, pedagogical, professional or learning outcome of the situation.
    required: true

  actor:
    definition: >-
      The human whose action, learning, judgement or responsibility is being examined.
    allowed_values:
      - teacher_professional
      - learner
      - multiple_humans
    required: true

  process_position:
    definition: >-
      The position of the situation within the process or model actually being used. The EAI Standard does not prescribe universal phases.
    required: true

  core_human_action:
    definition: >-
      A context-dependent human action whose execution, judgement, control or evidence matters for the intended learning, professional judgement, pedagogical purpose or decision in the situation. In an EAI case, every core human action is interpreted through four required anchors: context, goal, actor and process position.
    properties:
      context_dependent: true
      actor_specific: true
      goal_specific: true
      process_position_specific: true
      may_be_multiple: true
      never_global_by_skill_name: true

  skill:
    definition: >-
      A reusable description of human capability that may occur across multiple contexts, models or tasks. A skill is not automatically a core human action.

  skill_family:
    definition: >-
      A grouping used to organise related skills without implying a mandatory process sequence or hierarchy of importance.

  microstructure:
    definition: >-
      A reusable description of a smaller human operation. In a concrete EAI case, a microstructure is a constituent operation within the selected core human action when decomposition is needed to distinguish human-AI allocation, evidence, handback or remediation. The same microstructure may be reused across different skills or core human actions in different contexts.
    properties:
      constituent_within_case_core_action: true
      may_be_reused_across_skills: true
      may_be_reused_across_core_actions: true
      may_have_multiple_relations: true
      is_not_automatically_core: true

  ai_action:
    definition: >-
      The action actually performed by an AI system in relation to a human action or microstructure.

  allocation:
    definition: >-
      The explicit distribution of relevant actions between human and AI at the level required to distinguish material contributions.

  protection_assessment:
    definition: >-
      A source-qualified assessment of which dimensions of a core human action should remain human, remain directly evidenced, remain under effective human oversight or authority, or be returned to human execution. Protection is assessed per dimension and is not a single protected/unprotected label.

  protection_requirement:
    definition: >-
      A specific dimension of protection, such as human execution, human judgement, human evidence, effective human oversight, authority to intervene, handback, re-demonstration or direct human interaction.

  protection_basis:
    definition: >-
      The identified normative, legal, scientific, professional, framework-based or institutional source used to support a protection assessment, with its applicability and bindingness recorded separately.

  support_condition:
    definition: >-
      A material condition describing what assistance, prior output, hints, tools or other support was available when human evidence was produced.

  human_evidence:
    definition: >-
      Observable information that supports a bounded claim about human performance, judgement, learning or mastery.

  evidence_claim:
    definition: >-
      The specific statement that evidence is intended to support, such as current performance, professional judgement, independent mastery, retention or transfer.

  responsibility:
    definition: >-
      The human obligation to interpret, decide, approve, judge or act where the situation requires accountable human judgement.

  handback:
    definition: >-
      The planned transfer of an action from AI-supported or AI-performed execution back to human execution so that the human action can become visible again.

  remediation:
    definition: >-
      A targeted response after a relevant human action was not sufficiently performed, observed or evidenced. Remediation ends with renewed human performance or evidence.

  re_demonstration:
    definition: >-
      A new human execution of the relevant action after support, handback or remediation.

  performance:
    definition: >-
      Successful production or task completion in the current situation, regardless of how much assistance was used.

  independent_mastery:
    definition: >-
      Successful human execution of the relevant action with support reduced to the level required by the claim being made.

  retention:
    definition: >-
      Successful later execution after a meaningful delay under support conditions appropriate to the claim.

  transfer:
    definition: >-
      Successful execution of the relevant action in a meaningfully different task, context or representation.

  model_adapter:
    definition: >-
      A mapping layer that connects a named educational, pedagogical or professional process model to EAI Standard semantics while preserving the source model's own terminology and structure.

  context_profile:
    definition: >-
      An optional overlay that refines expectations for factors such as age, education level, subject, curriculum, language or institutional setting without redefining core EAI terms.

  registry:
    definition: >-
      A versioned collection of reusable canonical or candidate entries such as skills, microstructures, AI actions, evidence types or remediation patterns.

  stable_identifier:
    definition: >-
      An identifier whose meaning is fixed within a released version and is intended to support reliable reference and exchange.

  extension:
    definition: >-
      A local or third-party addition that builds on the EAI Standard without being part of the canonical namespace unless accepted through the governance process.

  provenance:
    definition: >-
      Information that records the origin, source or authorship of a model term, mapping, evidence source or extension sufficiently to distinguish source content from EAI interpretation.

  conformance:
    definition: >-
      Whether an implementation or artefact satisfies the structural and normative requirements of a selected EAI conformance profile. Conformance is separate from whether substantive information is complete or remains unknown, and it is not evidence of educational effectiveness.

  unknown:
    definition: >-
      A state used when required or interpretation-relevant information is absent, ambiguous or unsupported. Unknown must not be silently converted into a low, negative, safe or conformant/non-conformant judgement.
