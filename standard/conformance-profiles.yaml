standard_version: 0.5.0-candidate
status: candidate

result_model:
  conformance:
    conformant: The artifact satisfies the structural and normative requirements of the selected profile.
    non_conformant: One or more blocking structural or normative requirements of the selected profile are violated.
  information_state:
    complete: All information required for the selected profile and intended interpretation is present at the required level.
    contains_unknowns: Material uncertainty is explicitly preserved, but the artifact can still be structurally conformant when no unsupported stronger claim is made.
    incomplete: Required information is missing in a way that prevents the selected profile from being fully evaluated.
  separation_rule: >-
    Unknown information is not itself a conformance failure. A conformant representation may contain explicit unknowns. Non-conformance occurs when a structural or normative requirement is violated, including when unknown information is silently converted into a stronger substantive judgement.

profiles:
  - id: CP-01
    label: basic_case_exchange
    purpose: Exchange a minimally interpretable EAI case between systems.
    requires:
      - context
      - goal
      - actor
      - at_least_one_process_position
      - at_least_one_core_action_or_unknown_marker
      - each_core_action_references_its_relevant_process_position_or_positions
      - core_action_interpretable_through_context_goal_actor_and_process_position
    may_report:
      - primary_process_position
      - extensions
      - retained_unknowns

  - id: CP-02
    label: human_ai_allocation
    purpose: Describe how relevant human and AI operations are distributed within a case.
    requires:
      - all_CP-01_requirements
      - microstructure_level_analysis_when_allocation_differs
      - selected_microstructures_constituent_of_the_case_core_action
      - separate_human_execution
      - explicit_canonical_ai_actions
      - unknowns_preserved
    may_report:
      - protection_assessment
    constraints:
      - protection_if_reported_uses_canonical_dimensions
      - protection_basis_preserves_type_applicability_and_bindingness
      - protection_status_is_dimension_specific

  - id: CP-03
    label: assessment_evidence
    purpose: Support bounded claims about performance, professional judgement, mastery, retention or transfer.
    requires:
      - all_CP-02_requirements
      - explicit_claim_type
      - claim_matched_evidence_for_supported_claims
      - handback_and_redemonstration_when_required
    prohibitions:
      - generated_product_as_sole_independent_mastery_evidence
      - unknown_coerced_to_judgement
      - protection_basis_authority_overstated
    interpretation_rule: >-
      A case may remain conformant while reporting that evidence, legal applicability or another protection basis is unknown or insufficient, provided it does not present the stronger human claim or protection conclusion as established.

  - id: CP-04
    label: source_preserving_model_adapter
    purpose: Map an external didactic, pedagogical or professional model while preserving the source model.
    requires:
      - source_reference
      - source_elements
      - original_source_labels
      - retained_unmapped_elements
      - explicit_mapping_type
    prohibitions:
      - silent_source_element_deletion
      - source_terminology_replacement
      - mapping_presented_as_source_model_content

  - id: CP-05
    label: registry_item
    purpose: Exchange reusable skills, microstructures or remediation content.
    requires:
      - stable_item_identifier
      - human_readable_label
      - definition_or_description
    constraints:
      - registry_item_not_globally_core
      - extensions_namespaced

  - id: CP-06
    label: full_interoperability
    purpose: Declare broad implementation support for the candidate standard.
    requires:
      - CP-01
      - CP-02
      - CP-03
      - CP-04
      - CP-05
      - CP-07
      - CP-08
      - structured_diagnostics
      - declared_standard_version
      - declared_unsupported_optional_semantics
      - protection_assessment_schema_support

  - id: CP-07
    label: protection_assessment
    purpose: Exchange a source-qualified, dimension-specific assessment of which aspects of human action or control should remain protected.
    requires:
      - protected_dimension_identifier
      - protection_status
      - typed_basis_for_required_or_recommended_protection
      - basis_applicability_when_basis_is_present
      - basis_bindingness_when_basis_is_present
      - rationale_or_basis_for_delegable_status
      - unknowns_preserved
    constraints:
      - status_assessed_per_dimension
      - source_authority_not_overstated
      - legal_and_scientific_bases_not_conflated
      - required_status_has_applicable_binding_or_EAI_normative_basis
      - no_automatic_status_propagation
    interpretation_rule: >-
      CP-07 validates the representation and bounded use of a protection assessment. A delegable conclusion may be justified by an explicit bounded rationale when no positive protection basis applies. CP-07 does not establish that a legal source applies to the case, that scientific evidence is sufficient for the context, or that the educational judgement itself is substantively correct when those questions require external or human review.

  - id: CP-08
    label: semantic_alignment
    purpose: Exchange contextual concept meanings and learner-specific action analysis without treating a technical capability or output as educational meaning.
    requires:
      - all_CP-02_requirements
      - distinct_concept_meanings_and_positions_where_material_to_interpretation
      - learner_specific_action_kind_where_applicable_or_explicit_unknown
      - target_action_before_task_density_and_support_replacement_analysis
      - educational_intent_guides_technical_configuration_when_design_is_claimed
      - meaningful_human_evidence_for_claims_about_meaning_making
    constraints:
      - concept_positions_not_quality_scores
      - functional_similarity_not_construct_equivalence
      - learner_action_specialization_not_a_parallel_action
      - task_density_not_output_volume_or_universal_percentage
      - unknowns_preserved
    interpretation_rule: >-
      Concept meanings and learner-specific designation are optional in the general case schema. CP-08 requires them where materially relevant, or explicit unknown information with rationale when they cannot yet be established. Hybrid and human-review requirements remain review-dependent.

notes:
  - Conformance is profile-specific; a system may conform to one profile without implementing all others.
  - Information completeness and conformance are separate result dimensions.
  - Profiles describe structural and semantic interoperability, not educational effectiveness.
  - Passing conformance does not validate the quality of an instructional design, protection recommendation or AI system.
