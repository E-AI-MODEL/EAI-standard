standard_version: 0.4.0-candidate
status: candidate

result_model:
  conformance:
    conformant: The artifact satisfies the structural and normative requirements of the selected profile.
    non_conformant: One or more blocking structural or normative requirements of the selected profile are violated.
  information_state:
    complete: All information required for the selected profile and intended interpretation is present at the required level.
    contains_unknowns: Material uncertainty is explicitly preserved, but the artifact can still be structurally conformant when no unsupported stronger claim is made.
    incomplete: Required information is missing in a way that prevents the selected profile from being fully evaluated.
  separation_rule: >-
    Unknown information is not itself a conformance failure. A conformant representation may contain explicit unknowns. Non-conformance occurs when a structural or normative requirement is violated, including when unknown information is silently converted into a stronger substantive judgement.

profiles:
  - id: CP-01
    label: basic_case_exchange
    purpose: Exchange a minimally interpretable EAI case between systems.
    requires:
      - context
      - goal
      - actor
      - process_position
      - at_least_one_core_action_or_unknown_marker
    may_report:
      - extensions
      - retained_unknowns

  - id: CP-02
    label: human_ai_allocation
    purpose: Describe how relevant human and AI operations are distributed within a case.
    requires:
      - all_CP-01_requirements
      - microstructure_level_analysis_when_allocation_differs
      - separate_human_execution
      - explicit_ai_action
      - unknowns_preserved

  - id: CP-03
    label: assessment_evidence
    purpose: Support bounded claims about performance, professional judgement, mastery, retention or transfer.
    requires:
      - all_CP-02_requirements
      - explicit_claim_type
      - claim_matched_evidence_for_supported_claims
      - handback_and_redemonstration_when_required
    prohibitions:
      - generated_product_as_sole_independent_mastery_evidence
      - unknown_coerced_to_judgement
    interpretation_rule: >-
      A case may remain conformant while reporting that evidence is unknown or insufficient, provided it does not present the stronger human claim as established.

  - id: CP-04
    label: source_preserving_model_adapter
    purpose: Map an external didactic, pedagogical or professional model while preserving the source model.
    requires:
      - source_reference
      - source_elements
      - original_source_labels
      - retained_unmapped_elements
      - explicit_mapping_type
    prohibitions:
      - silent_source_element_deletion
      - source_terminology_replacement
      - mapping_presented_as_source_model_content

  - id: CP-05
    label: registry_item
    purpose: Exchange reusable skills, microstructures or remediation content.
    requires:
      - stable_item_identifier
      - human_readable_label
      - definition_or_description
    constraints:
      - registry_item_not_globally_core
      - extensions_namespaced

  - id: CP-06
    label: full_interoperability
    purpose: Declare broad implementation support for the candidate standard.
    requires:
      - CP-01
      - CP-02
      - CP-03
      - CP-04
      - CP-05
      - structured_diagnostics
      - declared_standard_version
      - declared_unsupported_optional_semantics

notes:
  - Conformance is profile-specific; a system may conform to one profile without implementing all others.
  - Information completeness and conformance are separate result dimensions.
  - Profiles describe structural and semantic interoperability, not educational effectiveness.
  - Passing conformance does not validate the quality of an instructional design or AI system.
