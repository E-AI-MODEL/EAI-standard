version: 0.2.1-candidate
status: candidate
scope: recent_scientific_spine_2025_2026

policy:
  recency_priority: >-
    For AI-specific claims, the evidence spine prioritises 2025-2026 empirical studies, meta-analyses and current large-scale datasets. Older learning-science sources may be added as foundational theory, but they do not substitute for recent AI-specific evidence.
  discovery_rule: >-
    Internal literature maps, reviews and synthesis documents may be used to discover sources, but claims should link to the original publication whenever possible.
  status_rule: >-
    Preprints, working papers, industry research and policy datasets are explicitly marked and are not treated as equivalent to peer-reviewed causal evidence.

sources:
  - id: SRC-2026-BOOLZEN
    year: 2026
    authors: [Chiara Boolzen, Jochen Kuhn, Salome Flegr, Eva-Maria Rott, Niklas Stausberg, Stefan Kuechemann]
    title: Evidence of impact and interpretational limits of generative AI in STEM education: a systematic review and meta-analysis on cognitive learning outcomes
    publication: Artificial Intelligence Review
    type: peer_reviewed_systematic_review_meta_analysis
    doi: 10.1007/s10462-026-11665-9
    published: 2026-08-25
    scope: STEM; predominantly higher education; learner-GAI interaction
    design: 85 eligible studies; 49 studies and 59 effect sizes meta-analysed
    key_findings:
      - Conventional random-effects analysis was positive but highly heterogeneous.
      - The prediction interval was very wide and funnel-plot asymmetry indicated potential publication bias.
      - Learning-outcome type and whether AI augmented or substituted student cognitive activity explained part of the heterogeneity.
      - Process variables such as task delegation and verification remain under-measured.
    role: primary_recent_anchor

  - id: SRC-2026-STROMBERG
    year: 2026
    authors: [David Stromberg, Victor Lei, Yanhui Wu]
    title: The Generative AI Learning Penalty: Evidence from Chinese Secondary Education
    publication: CEPR Discussion Paper DP21577
    type: working_paper_longitudinal_panel_quasi_experimental
    published: 2026-06-02
    url: https://cepr.org/publications/dp21577
    scope: 26811 students; grades 7-12; nine subjects; 30 months
    design: staggered AI adoption; difference-in-differences; homework plus closed-book and high-stakes exams
    key_findings:
      - AI adoption increased homework scores and reduced homework completion time.
      - Closed-book monthly exam scores declined after adoption, with losses increasing over time.
      - Learning losses were concentrated among users whose behaviour was consistent with homework outsourcing.
      - Students who maintained similar homework time showed much smaller learning losses.
    limitations:
      - Working paper, not yet peer reviewed.
      - Observational adoption design despite strong panel structure and identification strategy.
    role: primary_recent_anchor

  - id: SRC-2026-WU
    year: 2026
    authors: [Xinning Wu, Pei Zhu, Jinliang Zhang, Mengwei Yin, Yingxi Wang]
    title: ChatGPT's impact on student learning outcomes: a meta-analysis of 35 experimental studies
    publication: Humanities and Social Sciences Communications
    type: peer_reviewed_meta_analysis
    doi: 10.1057/s41599-026-07019-z
    published: 2026-03-26
    scope: 35 experimental and quasi-experimental studies; 4193 participants; 134 effect sizes
    key_findings:
      - Moderate positive mean effect on learning outcomes.
      - Subject, intervention duration and instructional mode significantly moderated outcomes.
      - Authors identify limitations in multidimensional moderators and long-term outcomes.
    role: recent_synthesis

  - id: SRC-2026-OECD-PISA
    year: 2026
    authors: [OECD]
    title: PISA 2025 Results Volume I - Future-Ready Students
    publication: OECD Publishing
    type: large_scale_international_assessment_observational
    doi: 10.1787/73451bc5-en
    published: 2026-09-08
    scope: more than 760000 students across 91 countries and economies
    key_findings:
      - AI use for specific schoolwork tasks such as drafting, summarising and research is associated with lower science performance than non-use on average.
      - Weekly general-purpose AI use shows a different pattern and can be similar to non-use.
      - Students who frequently use AI for learning and report school opportunities to evaluate AI-generated information tend to perform slightly better than comparable users without those opportunities.
    limitations:
      - Observational associations; not causal estimates of AI effects.
    role: current_large_scale_context

  - id: SRC-2026-WEIDLICH
    year: 2026
    authors: [Joshua Weidlich]
    title: When Students Use AI: Toward Validity-Centered Assessment Design
    publication: SocArXiv / OSF preprint
    type: preprint_conceptual_assessment_validity
    doi: 10.31235/osf.io/f6hz7_v1
    published: 2026-04
    scope: assessment interpretation in contexts of student GenAI use
    key_findings:
      - Reframes GenAI assessment concerns from cheating alone toward validity of score interpretations and decisions.
      - Emphasises that the same observed product can support weaker inferences about unaided student capability when AI contributes materially.
    limitations:
      - Preprint; conceptual rather than intervention-effect study.
    role: recent_validity_framework

  - id: SRC-2026-VELANDER
    year: 2026
    authors: [Johanna Velander]
    title: Beyond operational skills: Teachers' AI knowledge and interactions with generative AI in lesson planning
    publication: Computers and Education Open
    type: peer_reviewed_mixed_methods_teacher_practice
    doi: 10.1016/j.caeo.2026.100371
    published: 2026-06
    scope: K-12 teachers; 61 questionnaire participants; approximately 1300 prompt-response pairs plus group reflection
    key_findings:
      - AI-related teacher knowledge is enacted in situated teacher-AI collaboration, not captured fully by self-report alone.
      - Teacher-AI interaction displayed different distributions of epistemic agency, initiative and authority.
      - Teachers often positioned GenAI as the primary generator of instructional content, with fewer instances of iterative negotiation or co-construction.
    role: primary_recent_teacher_anchor

  - id: SRC-2026-ALDIGHRIR
    year: 2026
    authors: [Wafa Mohammed Aldighrir]
    title: Development and validation of the teachers generative AI professional competence scale
    publication: Scientific Reports
    type: peer_reviewed_scale_development_validation
    doi: 10.1038/s41598-026-65021-6
    published: 2026-08-04
    scope: 648 teachers; sequential exploratory mixed-method scale development and validation
    key_findings:
      - Teacher GenAI professional competence was modelled as pedagogical judgement, ethical leadership and professional agency.
      - Pedagogical judgement includes deciding whether, when and for what educational purpose AI is appropriate.
      - Professional agency includes retaining authorship, autonomy and final responsibility rather than treating AI output as a substitute for judgement.
    limitations:
      - Psychometric validation of a proposed construct; not evidence that these dimensions causally improve learning.
    role: primary_recent_teacher_anchor

  - id: SRC-2026-COSTACHE
    year: 2026
    authors: [Oana Costache, Roald Pieter Verhoeff, Pierre Gorissen]
    title: Teacher-AI Collaboration and the Professionalization of Teachers in the Age of Automation: A Systematic Review
    publication: Education Sciences
    type: peer_reviewed_systematic_review
    doi: 10.3390/educsci16060938
    published: 2026-06-13
    scope: 39 empirical studies on teacher professionalization and AI collaboration published 2015-2025
    key_findings:
      - Reviews how responsibilities for detecting, diagnosing and acting on educational data are distributed between teachers and AI systems.
      - Treats teacher-AI collaboration as a professionalization and responsibility-distribution question rather than only a technology-use question.
    role: primary_recent_teacher_synthesis

  - id: SRC-2026-GAA-LS
    year: 2026
    authors: [Juntao Nie, Zeyu Zhang, Xiaomei Lu, Yinlan Zhang, Min Zhang]
    title: Development and validation of the generative AI assessment literacy scale for higher education students: psychometric evidence and associations with feedback engagement and academic integrity
    publication: Frontiers in Education
    type: peer_reviewed_scale_development_validation
    doi: 10.3389/feduc.2026.1934632
    published: 2026-09-10
    scope: two-study psychometric validation; 486 and 798 higher-education students
    key_findings:
      - Assessment-specific GenAI literacy includes assessment-criteria awareness, AI-task appropriateness judgement, verification and evidence checking, ethical attribution and feedback uptake.
      - General AI-use frequency did not replace task-specific assessment judgement as the construct of interest.
    role: recent_skill_and_assessment_context

  - id: SRC-2025-BASTANI
    year: 2025
    authors: [Hamsa Bastani, Osbert Bastani, Alp Sungu, Haosen Ge, Ozge Kabakci, Rei Mariman]
    title: Generative AI without guardrails can harm learning: Evidence from high school mathematics
    publication: Proceedings of the National Academy of Sciences
    type: peer_reviewed_field_experiment
    doi: 10.1073/pnas.2422633122
    published: 2025-06-25
    scope: nearly 1000 high-school mathematics students
    design: field experiment comparing GPT Base, safeguarded GPT Tutor and control conditions
    key_findings:
      - AI substantially improved performance during supported practice.
      - After AI access was removed, the unrestricted GPT Base group performed worse than students who never had access.
      - Learning safeguards largely mitigated the negative post-support effect.
      - Students used unrestricted AI more as a crutch, while tutoring safeguards changed how help was provided.
    role: primary_recent_anchor

  - id: SRC-2025-KESTIN
    year: 2025
    authors: [Greg Kestin, Kelly Miller, Anna Klales, Timothy Milbourne, Gregorio Ponti]
    title: AI tutoring outperforms in-class active learning: an RCT introducing a novel research-based design in an authentic educational setting
    publication: Scientific Reports
    type: peer_reviewed_randomized_controlled_trial
    doi: 10.1038/s41598-025-97652-6
    published: 2025-06-03
    scope: college physics; 316 students across two lesson topics
    key_findings:
      - A deliberately designed AI tutor produced larger immediate post-test learning gains than the comparison active-learning class in this setting.
      - Students completed the AI-tutored lesson in less time and reported strong engagement and motivation.
      - The result supports designed tutoring rather than unrestricted generic chatbot use.
    limitations:
      - Narrow subject, institution and lesson duration.
      - Primarily immediate learning outcomes, not long-term transfer.
    role: primary_recent_positive_case

  - id: SRC-2025-LEE
    year: 2025
    authors: [Hao-Ping Hank Lee, Advait Sarkar, Lev Tankelevitch, Ian Drosos, Sean Rintel, Richard Banks, Nicholas Wilson]
    title: The Impact of Generative AI on Critical Thinking: Self-Reported Reductions in Cognitive Effort and Confidence Effects From a Survey of Knowledge Workers
    publication: CHI 2025 Proceedings
    type: peer_reviewed_mixed_methods_survey
    doi: 10.1145/3706598.3713778
    published: 2025-04-25
    scope: 319 knowledge workers; 936 real-world GenAI use examples
    key_findings:
      - Higher confidence in GenAI was associated with less reported critical-thinking engagement.
      - Higher confidence in one's own task ability was associated with more critical-thinking engagement.
      - Cognitive work shifted from information gathering to verification, from problem solving to response integration, and from execution to stewardship.
    limitations:
      - Self-reported enaction and effort; not a direct learning-outcome experiment.
    role: professional_and_expertise_context

  - id: SRC-2025-CHEN-CHEUNG
    year: 2025
    authors: [Shuzhen Chen, Alan C. K. Cheung]
    title: Effect of generative artificial intelligence on university students learning outcomes: A systematic review and meta-analysis
    publication: Educational Research Review
    type: peer_reviewed_systematic_review_meta_analysis
    doi: 10.1016/j.edurev.2025.100737
    published: 2025-10
    scope: 57 studies; 97 estimations; higher education
    key_findings:
      - Positive pooled effects were reported for academic achievement, language skills, affective-motivational outcomes and higher-order thinking.
      - No statistically significant pooled effect was found for metacognition.
      - Effects varied by learner, tool, role, rule and context factors.
    role: recent_synthesis

  - id: SRC-2025-LIU
    year: 2025
    authors: [Xiaohong Liu, Baoxin Guo, Wei He, Xiaoyong Hu]
    title: Effects of Generative Artificial Intelligence on K-12 and Higher Education Students' Learning Outcomes: A Meta-Analysis
    publication: Journal of Educational Computing Research
    type: peer_reviewed_meta_analysis
    doi: 10.1177/07356331251329185
    published: 2025-04-11
    scope: 49 articles across K-12 and higher education
    key_findings:
      - Positive average effects were reported for learning achievement and motivation.
      - Effects varied by education level, subject, interface, interaction approach and experimentation time.
    role: recent_synthesis

secondary_foundational_sources:
  - id: SRC-2024-TUTORCOPILOT
    year: 2024
    authors: [Rose E. Wang, Ana T. Ribeiro, Carly D. Robinson, Susanna Loeb, Dora Demszky]
    title: Tutor CoPilot: A Human-AI Approach for Scaling Real-Time Expertise
    publication: arXiv preprint / field RCT report
    type: preprint_randomized_controlled_trial
    published: 2024-10-03
    scope: 900 tutors and 1800 K-12 students in live tutoring
    key_findings:
      - Students with AI-supported tutors were more likely to master topics.
      - Benefits were largest for lower-rated tutors.
      - AI-supported tutors used more high-quality pedagogical strategies and were less likely to give away answers.
    note: >-
      Retained as useful earlier evidence on human-AI tutoring, but no longer treated as part of the recent 2025-2026 scientific spine.
