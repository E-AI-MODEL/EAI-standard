id: CASE-ARG-EI-001
standard_version: 0.4.0-candidate
context: >-
  A learner is practising argumentation during Guided practice in the Archer & Hughes Explicit Instruction adapter. The learner must build and defend a position. AI may challenge the reasoning with a counterargument after the learner has produced an initial argument.
goal: >-
  The learner can formulate a defensible position, generate a relevant argument, respond to a counterargument and draw a warranted conclusion.
