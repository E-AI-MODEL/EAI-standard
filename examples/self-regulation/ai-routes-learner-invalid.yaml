id: EX-SR-INVALID-001
standard_version: 0.4.0-candidate
context: >-
  A learner completes the subject-matter steps of a study task successfully. An AI agent has selected the learning route, chosen the strategy, monitored progress and automatically changed the next task and support level. The completed work is then treated as evidence that the learner can regulate this learning process independently.
goal: >-
  Determine whether the learner can independently regulate planning, strategy selection, monitoring and adjustment during the learning task.
process_positions:
  - id: PP-SR-EVIDENCE
    model: null
    label: self_regulated_learning_evidence_point
    source_term: independent regulation claim after AI-routed study sequence
    source_element_id: null
    primary: true
primary_process_position: PP-SR-EVIDENCE
actors:
  - actor: learner
    core_actions:
      - id: demonstrate_independent_self_regulation
        label: independently regulate planning strategy monitoring and adjustment
        status: confirmed
        process_position_refs: [PP-SR-EVIDENCE]
        skill_refs: [LSK-041, LSK-042, LSK-043]
        microstructures:
          - id: MS-LSR-03
            label: construct_action_plan
            human_execution: none
            ai_actions: [AIA-25]
            evidence_refs: []
            handback_required: true
            remediation_ref: REM-11
          - id: MS-LSR-04
            label: select_strategy_for_goal
            human_execution: none
            ai_actions: [AIA-09]
            evidence_refs: []
            handback_required: true
            remediation_ref: REM-11
          - id: MS-LSR-06
            label: monitor_progress_against_goal
            human_execution: partial
            ai_actions: [AIA-07]
            evidence_refs: []
            handback_required: true
            remediation_ref: REM-11
          - id: MS-LSR-12
            label: change_strategy_from_evidence
            human_execution: none
            ai_actions: [AIA-24]
            evidence_refs: []
            handback_required: true
            remediation_ref: REM-11
claim_type: independent_mastery
evidence_items: []
human_control:
  responsible_actor: learner
  decision_authority: none
  information_available: partial
  timing: during
  can_modify: false
  can_reject: false
  can_override: false
  can_stop: false
  can_rollback: false
  effectiveness: absent
  evidence_refs: []
unknowns:
  - Whether the learner can construct an effective plan without AI routing.
  - Whether the learner can detect a need to change strategy without automated adaptation.
notes: >-
  Successful learner execution of subject-matter steps is not evidence of independent self-regulation when AI performed the regulatory operations being claimed. Regulatory control must be returned and demonstrated directly before the stronger claim is made.
