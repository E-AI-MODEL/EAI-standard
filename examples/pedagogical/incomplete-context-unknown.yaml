human_control:
  responsible_actor: teacher_professional
  notes: >-
    The teacher may decide on a low-consequence next step such as arranging direct contact, while the cause of the participation change remains explicitly unknown.
unknowns:
  - The learner's own account of the change is not yet available.
  - The reason for the change in participation is unknown.
  - It is unknown whether historical context is relevant to the current situation.
notes: >-
  The representation is conformant while the unresolved interpretation remains explicit. The standard does not require speculative completion of the missing meaning before a proportionate information-gathering step can be taken.
