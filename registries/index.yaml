standard_version: 0.4.0-candidate
artifact_version: 0.2.1-candidate
status: candidate

skill_registries:
  - id: REG-SKILL-TEACHER
    actor: teacher_professional
    path: skills/teacher.yaml
  - id: REG-SKILL-LEARNER
    actor: learner
    path: skills/learner.yaml
  - id: REG-SKILL-AI-INTERACTION
    actor: cross_cutting
    applies_to: [teacher_professional, learner]
    path: skills/ai-interaction.yaml

microstructure_registries:
  - id: REG-MS-ARGUMENTATION
    actor: learner
    skill: argumentation
    path: microstructures/argumentation.yaml
  - id: REG-MS-TEACHER-DIAGNOSTIC
    actor: teacher_professional
    skill: diagnostic_professional_judgement
    path: microstructures/teacher-diagnostic-judgement.yaml
  - id: REG-MS-TEACHER-SCAFFOLD
    actor: teacher_professional
    skill: scaffolding_and_feedback_regulation
    path: microstructures/teacher-scaffolding-and-feedback.yaml
  - id: REG-MS-TEACHER-PEDAGOGICAL
    actor: teacher_professional
    skill: pedagogical_relational_judgement
    path: microstructures/teacher-pedagogical-judgement.yaml
  - id: REG-MS-LEARNER-RETRIEVAL
    actor: learner
    skill: retrieval_and_independent_reperformance
    path: microstructures/learner-retrieval-and-independent-performance.yaml

remediation_registries:
  - id: REG-REM-INTERVENTIONS
    path: remediation/interventions.yaml

coverage_audits:
  - id: AUDIT-SKILL-MS-COVERAGE-001
    path: coverage/skill-microstructure-coverage.yaml
    status: candidate_audit
    purpose: >-
      Makes current skill-to-microstructure coverage and priority gaps explicit without treating absence of a dedicated decomposition as a conformance failure.
    resolution_log: coverage/resolution-log.yaml

rules:
  - Registry entries instantiate or refine reusable content but do not redefine canonical EAI vocabulary.
  - A registry skill or microstructure becomes a core human action only in a concrete case.
  - Registry identifiers should remain stable within a major standard version once promoted from candidate status.
  - A skill does not require a dedicated microstructure registry merely because it exists in the skill inventory.
  - Microstructure decomposition should be added when it materially improves human-AI allocation, evidence interpretation, handback or remediation.
  - Cross-cutting AI-interaction skills should reuse existing human-action microstructures where possible instead of creating a parallel decomposition automatically.
