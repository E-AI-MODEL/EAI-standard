standard_version: 0.4.0-candidate
artifact_version: 0.2.0-candidate
status: candidate

purpose: >-
  Records immediate repository corrections made as a direct result of the registry coverage audit. This keeps the audit useful as an inspectable snapshot while showing which findings have already been resolved.

resolved:
  - id: COV-RES-001
    source_audit: AUDIT-SKILL-MS-COVERAGE-001
    finding: >-
      The teacher pedagogical judgement microstructure registry semantically covered interpret_behaviour_in_context, make_pedagogical_judgement and determine_pedagogical_follow_up but did not declare those contributes_to relations.
    action: >-
      Added explicit contributes_to relations for TSK-066, TSK-067 and TSK-068. Related links to evidence discussion, documentation and effect monitoring were also made explicit where the current registry already contains the relevant operations.
    files_changed:
      - registries/microstructures/teacher-pedagogical-judgement.yaml
    effect_on_audit: >-
      TSK-066, TSK-067 and TSK-068 move from partial to deep candidate coverage in the current status view.

  - id: COV-RES-002
    source_audit: AUDIT-SKILL-MS-COVERAGE-001
    finding: >-
      Learner self-regulation and metacognition were the highest-priority uncovered allocation domain because visible task execution can remain human while AI takes over goal setting, planning, monitoring, routing and adjustment.
    action: >-
      Added a sixteen-item learner self-regulation and metacognition microstructure registry covering goal orientation, planning, strategy selection, monitoring, impasse detection, help regulation, resumption of regulatory control, strategy adjustment, effort regulation, self-evaluation and reflection.
    files_changed:
      - registries/microstructures/learner-self-regulation-and-metacognition.yaml
      - registries/index.yaml
      - registries/coverage/current-status.yaml
      - evidence/construct-map.yaml
      - registries/remediation/interventions.yaml
    effect_on_audit: >-
      LSK-040 through LSK-048 move to deep candidate coverage. The learner deep-coverage count rises from 4 to 13, and the microstructure count rises from 77 to 93.

open:
  - id: COV-OPEN-001
    finding: Argumentation registry metadata is older and less uniform than the newer deep registries.
  - id: COV-OPEN-002
    finding: Several deep registries use a bundle/focus identifier in the top-level skill object rather than a direct skill-registry id.
  - id: COV-OPEN-003
    finding: No strict schema currently validates complete skill-registry entries.
  - id: COV-OPEN-004
    finding: Registry version metadata still needs full migration to the 0.4 publication policy.
  - id: COV-OPEN-005
    finding: Teacher assessment and evidence judgement is now the highest-priority deep-coverage gap.
