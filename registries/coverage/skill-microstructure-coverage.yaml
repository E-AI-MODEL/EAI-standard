standard_version: 0.4.0-candidate
artifact_version: 0.1.0-candidate
status: candidate_audit

audit_scope:
  - registries/skills/teacher.yaml
  - registries/skills/learner.yaml
  - registries/skills/ai-interaction.yaml
  - registries/microstructures/argumentation.yaml
  - registries/microstructures/learner-retrieval-and-independent-performance.yaml
  - registries/microstructures/teacher-diagnostic-judgement.yaml
  - registries/microstructures/teacher-scaffolding-and-feedback.yaml
  - registries/microstructures/teacher-pedagogical-judgement.yaml

purpose: >-
  Audits whether current reusable skill entries have sufficient microstructure coverage for action-level human-AI allocation. Coverage is not a quality score and does not imply that every skill requires its own dedicated microstructure registry.

coverage_states:
  deep:
    description: >-
      A current microstructure registry directly and substantially covers the skill through an explicit registry link or explicit contributes_to relation.
  partial:
    description: >-
      Current microstructures cover material parts of the skill, but the skill is not yet fully represented at action level or the link is not explicit enough for reliable exchange.
  none:
    description: >-
      No current microstructure registry provides sufficient action-level coverage for this skill.

decomposition_priorities:
  high: >-
    Missing decomposition is likely to hide materially different human-AI allocations, evidence conditions or handback/remediation requirements.
  medium: >-
    Decomposition would improve consistency and reuse, but the skill can often still be represented meaningfully at skill level.
  low: >-
    No dedicated decomposition should be added until implementation experience demonstrates a recurring interoperability problem.
  covered: Existing decomposition is currently sufficient for candidate-stage testing; this is not a claim of scientific completeness.

