  - id: REG-MS-ARGUMENTATION
    path: registries/microstructures/argumentation.yaml
    microstructure_count: 27
    strengths: [rich_action_descriptions, ai_takeover_risk, observable_signal, diagnostic_prompt, remediation_hint]
    gaps:
      - per-item actor is not recorded even though the registry is learner-scoped
