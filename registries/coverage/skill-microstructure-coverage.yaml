structural_findings:
  - id: COV-F01
    finding: >-
      The primary teacher and learner skill inventories are broad, but deep microstructure coverage is selective rather than comprehensive.
    implication: The repository must not describe all skills as fully decomposed.

  - id: COV-F02
    finding: >-
      A dedicated microstructure registry should not be created for every skill automatically.
    implication: Reusable cross-skill microstructures are preferred where the same operation appears across skills.

  - id: COV-F03
    finding: >-
      The current top-level `skill` object in microstructure registry files sometimes names a registry focus bundle rather than a canonical skill id.
    implication: The reference semantics of that field should be clarified before registry-level validation is made strict.

  - id: COV-F04
    finding: >-
      The argumentation registry is structurally older than the four newer deep registries.
    implication: It should be upgraded to the same metadata profile before being treated as a template for new registries.

  - id: COV-F05
    finding: >-
      The AI-interaction skill registry currently has no dedicated microstructure registry and should primarily reuse human-action microstructures instead of creating a parallel AI-literacy decomposition for every skill.
    implication: Add dedicated AI-interaction microstructures only where a genuinely new human operation remains after reuse.

  - id: COV-F06
    finding: >-
      No dedicated JSON Schema currently validates complete skill registry entries to the same degree that `schemas/microstructure.schema.json` validates individual microstructure items.
    implication: A skill registry schema or a more general registry-item schema is needed before executable registry conformance.

recommended_build_order:
  - priority: 1
    target: learner_self_regulation_and_metacognition
    rationale: >-
      AI can leave visible task execution with the learner while taking over goal setting, route selection, monitoring and adjustment. This is a known allocation blind spot if only task execution is decomposed.
  - priority: 2
    target: teacher_assessment_and_evidence_judgement
    rationale: >-
      Claims about evidence, mastery and professional judgement are central to the standard, but TSK-050 through TSK-054 are not yet deeply decomposed.
  - priority: 3
    target: learner_reasoning_and_problem_solving
    rationale: >-
      Argumentation is deeply represented, but analysis, inference, causal reasoning, problem solving, evaluation and decision remain only partially or not at all decomposed.
  - priority: 4
    target: teacher_design_and_task_architecture
    rationale: >-
      AI changes tasks before execution begins. Goal, activity, practice, support, independence and evidence design therefore need action-level coverage.
  - priority: 5
    target: learner_research_and_source_evaluation
    rationale: >-
      Search, source selection, method choice, evidence analysis and conclusion are common AI-assisted operations with materially different evidence implications.
  - priority: 6
    target: teacher_instruction_and_modelling
    rationale: >-
      Explanation, modelling, example selection, questioning and checking understanding are only partly covered by diagnostic and scaffolding registries.
  - priority: 7
    target: learner_knowledge_building_and_orientation
    rationale: >-
      Task representation, concept formation, information selection and connection need coverage once the higher-risk regulatory, assessment and reasoning gaps are addressed.
  - priority: 8
    target: creation_social_collaboration_and_professional_reflection
    rationale: >-
      These remain important but are less urgent for the first executable interoperability profile than regulation, evidence and reasoning.
