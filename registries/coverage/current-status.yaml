interpretation_rules:
  - Coverage is a registry-development status, not EAI case conformance.
  - Deep coverage means candidate-stage decomposition exists; it does not mean empirical construct validation is complete.
  - A later implementation test may show that a skill needs less or more decomposition than currently represented.
