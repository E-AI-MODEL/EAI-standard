version: 0.1.0-candidate
status: non_normative_companion

principles:
  - A system profile describes technical configuration and capabilities, not human constructs.
  - The profile MUST NOT infer human understanding, learning, judgement or responsibility from functional performance.
  - The profile SHOULD describe configured behaviour at a level useful for interpreting observable AI actions.
  - Vendor-specific fields belong in namespaced extensions or source metadata, not in canonical EAI vocabulary.

layers:
  - id: SYS-L1
    label: model
    purpose: Describe the base or foundation model configuration.
    fields:
      - model_name
      - model_version
      - provider
      - deployment_type
      - modalities
      - context_window
      - base_capabilities
      - known_limitations

  - id: SYS-L2
    label: inference
    purpose: Describe how model inference is configured for the application.
    fields:
      - inference_mode
      - reasoning_effort_or_compute
      - sampling_configuration
      - deterministic_constraints
      - candidate_generation
      - self_consistency_or_voting
      - verification_steps
      - inference_limits
    interpretation_note: >-
      Labels such as reasoning effort are system configuration terms and MUST NOT be treated as evidence of human-like reasoning.

  - id: SYS-L3
    label: orchestration
    purpose: Describe how one or more models and control loops are coordinated.
    fields:
      - routing
      - model_selection
      - multi_model_configuration
      - planner
      - executor
      - evaluator
      - agent_loops
      - fallback
      - retry_policy
      - stop_conditions

  - id: SYS-L4
    label: context_and_data
    purpose: Describe information made available to the system during operation.
    fields:
      - prompt_context
      - retrieval_augmented_generation
      - knowledge_sources
      - source_freshness
      - session_memory
      - persistent_memory
      - user_context
      - task_context
      - organisation_context
      - data_boundaries
    interpretation_note: >-
      System memory is storage or retrieval functionality. It is not equivalent to human retention or remembering.

  - id: SYS-L5
    label: tools_and_actions
    purpose: Describe external tools and actions available to the system.
    fields:
      - search
      - code_execution
      - file_access
      - databases
      - external_apis
      - communication_tools
      - write_actions
      - transaction_actions
      - physical_or_device_actions
      - tool_permissions

  - id: SYS-L6
    label: application
    purpose: Describe how capabilities are embedded in a concrete product or workflow.
    fields:
      - use_case
      - workflow
      - interface
      - user_role
      - system_role
      - autonomy_level
      - proactive_behaviour
      - human_decision_points
      - escalation_points
      - task_boundaries
      - output_destination

  - id: SYS-L7
    label: evaluation
    purpose: Describe evidence about technical system performance and operational quality.
    fields:
      - task_quality
      - accuracy_or_validity
      - reliability
      - robustness
      - calibration
      - latency
      - cost_per_task
      - safety
      - security
      - bias_or_fairness
      - regression_testing
      - version_drift
    interpretation_note: >-
      Technical evaluation does not establish learning effectiveness or professional adequacy unless those outcomes are separately studied.

  - id: SYS-L8
    label: governance_and_control
    purpose: Describe authority, control, auditability and change responsibility around the system.
    fields:
      - owner
      - accountable_role
      - authorisation
      - access_control
      - logging
      - auditability
      - human_override
      - escalation
      - change_control
      - release_management
      - incident_handling
      - monitoring
      - retention_policy

cross_layer_rules:
  - Capability does not determine allocation.
  - Technical autonomy does not equal professional responsibility.
  - A system recommendation remains an AI action even when generated by a multi-agent or multi-model stack.
  - System evaluation metrics MUST NOT be substituted for human evidence types such as independent mastery, retention or transfer.
  - The same observable AI action MAY be implemented through materially different technical stacks.
  - A single system MAY produce different observable AI actions depending on workflow position and task configuration.
