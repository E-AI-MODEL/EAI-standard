version: 0.1.0-candidate
actor: teacher_professional
status: candidate

families:
  - id: TP-DESIGN
    label: design
    description: Designing learning, teaching, guidance or assessment situations.
    candidate_skills:
      - define_goal
      - interpret_starting_point
      - select_learning_activity
      - sequence_activity
      - design_instruction
      - design_practice
      - determine_support_level

  - id: TP-INSTRUCTION
    label: instruction_and_modelling
    description: Explaining, modelling and making content or processes accessible.
    candidate_skills:
      - select_what_to_explain
      - explain
      - choose_example
      - model_thinking_or_performance
      - regulate_complexity
      - check_initial_understanding

  - id: TP-DIAGNOSIS
    label: observation_and_diagnosis
    description: Interpreting learner behaviour, work or responses before deciding what they mean.
    candidate_skills:
      - observe_relevant_signal
      - distinguish_error_pattern
      - generate_possible_explanations
      - test_explanation
      - interpret_learning_state
      - identify_information_gap

  - id: TP-GUIDANCE
    label: guidance_and_intervention
    description: Selecting and adjusting support in response to the situation.
    candidate_skills:
      - ask_question
      - select_hint
      - select_feedback
      - regulate_support
      - fade_support
      - decide_on_reinstruction
      - remediate

  - id: TP-ASSESSMENT
    label: assessment_and_decision
    description: Weighing evidence and making accountable professional judgements.
    candidate_skills:
      - interpret_evidence
      - judge_quality
      - determine_mastery
      - weigh_multiple_sources
      - make_professional_decision
      - justify_decision

  - id: TP-PEDAGOGY
    label: pedagogical_action
    description: Human relational and pedagogical judgement in interactions with learners.
    candidate_skills:
      - establish_contact
      - listen_for_meaning
      - recognise_vulnerability_or_tension
      - perspective_taking
      - support_autonomy
      - set_boundary
      - interpret_behaviour_in_context
      - make_pedagogical_judgement
      - determine_follow_up

  - id: TP-EVALUATION
    label: evaluation_and_improvement
    description: Evaluating the effect of professional action and adjusting future action.
    candidate_skills:
      - evaluate_effect
      - compare_alternatives
      - examine_assumption
      - adjust_approach
      - generalise_learning_to_new_situation

notes:
  - Families are descriptive and non-exhaustive in candidate 0.1.
  - Skills become core human actions only in relation to a concrete goal and process position.
  - Didactic and pedagogical action are separate but may interact in the same situation.
