version: 0.1.0-candidate
actor: learner
status: candidate

families:
  - id: LP-ORIENT
    label: orientation_and_activation
    description: Building an initial representation of the task, topic or problem.
    candidate_skills:
      - retrieve_prior_knowledge
      - explore_problem
      - interpret_task
      - understand_goal
      - form_initial_expectation
      - formulate_initial_hypothesis

  - id: LP-KNOWLEDGE
    label: understanding_and_knowledge_building
    description: Building and reorganising meaning, concepts and relationships.
    candidate_skills:
      - select_relevant_information
      - form_concept
      - connect_concepts
      - explain
      - distinguish
      - compare
      - connect_example_to_concept

  - id: LP-PRACTICE
    label: practice_and_application
    description: Executing and refining procedures, strategies and applications.
    candidate_skills:
      - choose_strategy
      - execute_procedure
      - apply_knowledge
      - monitor_result
      - detect_error
      - adjust_approach
      - build_fluency

  - id: LP-REASON
    label: reasoning_and_problem_solving
    description: Analysing, inferring, evaluating, arguing, deciding and solving problems.
    candidate_skills:
      - analyse
      - compare
      - infer
      - reason_causally
      - argue
      - evaluate
      - solve_problem
      - decide

  - id: LP-CREATE
    label: creation_and_production
    description: Generating, selecting, combining, designing, formulating and revising products or ideas.
    candidate_skills:
      - generate_idea
      - select_idea
      - combine
      - design
      - formulate
      - revise
      - produce

  - id: LP-SELFREG
    label: self_regulation_and_metacognition
    description: Planning, monitoring and regulating one's own learning and action.
    candidate_skills:
      - set_goal
      - plan
      - monitor_progress
      - recognise_impasse
      - seek_help
      - choose_learning_strategy
      - change_strategy
      - evaluate_own_performance
      - reflect_on_process

  - id: LP-SOCIAL
    label: social_learning_and_communication
    description: Learning and acting through interaction with others.
    candidate_skills:
      - listen
      - explain_to_other
      - perspective_taking
      - give_feedback
      - process_feedback
      - collaborate
      - negotiate
      - reach_joint_decision

  - id: LP-EVIDENCE
    label: demonstration_retention_and_transfer
    description: Making human capability visible beyond supported task completion.
    candidate_skills:
      - explain_own_reasoning
      - independently_reperform
      - perform_after_delay
      - apply_in_new_context
      - combine_prior_learning

notes:
  - Families are model-independent and not a prescribed learning sequence.
  - A skill becomes a core human action only in a specific context.
  - Complexity and expected independence may later be refined by context profiles for age, level, subject and curriculum.
