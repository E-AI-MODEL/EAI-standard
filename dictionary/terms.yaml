# EAI Dictionary: bilingual (EN/NL) vocabulary for AI, learning and professional practice.
# Non-normative. Imported from the concept editions of 2026-09-20.
# Human-readable views are generated by scripts/render_dictionary.py; edit this file, not the .md views.

dictionary: EAI Dictionary
status: non_normative
edition: concept
author: Hans Visser / EAI
source_editions:
  - language: en
    title: EAI Dictionary (EN)
    date: '2026-09-20'
  - language: nl
    title: EAI Dictionary (NL)
    date: '2026-09-20'
positioning_model: proposals/0.5-semantic-alignment/concept-positioning.yaml
entries:
  - id: act_of_learning
    term: {en: Act of Learning, nl: De handeling van het leren}
    label: eai_term
    position: education_native
    definition:
      en: >-
        The human process in which learning actually happens: searching, choosing, trying, doubting, noticing errors, recovering, judging and acting again. A final product may come out of that process, but it is not the learning itself.
      nl: >-
        Het menselijke proces waarin leren daadwerkelijk plaatsvindt: zoeken, kiezen, proberen, twijfelen, fouten herkennen, herstellen, beoordelen en opnieuw handelen. Een eindproduct kan uit dit proces voortkomen, maar is niet hetzelfde als het leren zelf.
    why:
      en: >-
        AI can improve the product while removing the actions through which learning develops.
      nl: >-
        AI kan het product verbeteren terwijl juist de handelingen waardoor leren ontstaat minder zichtbaar worden of verdwijnen.
    practical_use:
      en: >-
        Look beyond the product and identify which meaningful learning actions the learner still performs personally.
      nl: >-
        Kijk voorbij het product en benoem welke betekenisvolle leerhandelingen de leerling nog zelf uitvoert.
    related: [core_learning_action, meaning_making_vs_addition, question_emergence, process_evidence]
  - id: action
    term: {en: Action, nl: Handeling}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human action: an action performed by a learner or professional that is relevant to the task, decision or learning process.
        nl: >-
          Menselijke handeling: een handeling van een leerling of professional die relevant is voor de taak, beslissing of het leerproces.
      system:
        en: >-
          System action: an operation performed by an AI system, such as generating, selecting, calling a tool or changing state.
        nl: >-
          Systeemhandeling: een bewerking van een AI-systeem, zoals genereren, selecteren, een tool aanroepen of state wijzigen.
    why:
      en: A system action is not evidence that the corresponding human action took place.
      nl: >-
        Een systeemhandeling is geen bewijs dat de overeenkomstige menselijke handeling heeft plaatsgevonden.
    practical_use:
      en: >-
        Name the actor for every consequential action: learner, professional, system, or both.
      nl: >-
        Benoem bij iedere beslissende handeling de actor: leerling, professional, systeem of beide.
  - id: adaptive_learning
    term: {en: Adaptive Learning, nl: Adaptief leren}
    label: common_term
    position: education_led
    definition:
      en: >-
        An approach in which learning content, difficulty, sequence or support is adjusted in response to evidence about learner performance or needs.
      nl: >-
        Een aanpak waarbij leerinhoud, moeilijkheid, volgorde of ondersteuning wordt aangepast op basis van bewijs over prestaties of behoeften van de leerling.
    why:
      en: >-
        Adaptive does not automatically mean educationally sound. The question is what changes, why, and what must stay with the learner.
      nl: >-
        Adaptiviteit is niet automatisch goede didactiek; wat wordt aangepast en wat bij de leerling blijft moet nog steeds onderwijskundig worden bepaald.
    practical_use:
      en: >-
        Connect each adaptation rule to the learning goal, phase and core learning action.
      nl: Verbind iedere adaptatieregel aan leerdoel, fase en kernhandeling.
  - id: agency
    term: {en: Agency, nl: Agency}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human agency: the capacity and opportunity to set direction, make choices, act and adjust within a learning process.
        nl: >-
          Menselijke / leerlingagency: het vermogen en de mogelijkheid om richting te geven, keuzes te maken, te handelen en bij te sturen binnen een leerproces.
      system:
        en: >-
          System agency: the extent to which an AI system can select and execute actions toward a goal within its tools, permissions and constraints.
        nl: >-
          Systeemagency: de mate waarin een AI-systeem binnen doelen, tools, rechten en grenzen zelfstandig acties kan initiëren of uitvoeren.
    why:
      en: >-
        Same word. Different construct. More system agency can even mean less learner agency.
      nl: >-
        Hetzelfde woord kan menselijk handelingsvermogen en technische handelingsruimte aanduiden. Als die worden samengevoegd verdwijnen verschillen in verantwoordelijkheid en leren.
    practical_use:
      en: >-
        State explicitly whether “agency” refers to the learner/professional or to the system.
      nl: >-
        Benoem expliciet of “agency” verwijst naar de leerling/professional of naar het systeem.
  - id: ai_agent
    term: {en: AI Agent, nl: AI-agent}
    label: common_term
    position: technology_native
    definition:
      en: >-
        An AI system set up to pursue a goal across multiple steps, often by choosing actions, using tools and maintaining state without a new prompt for every step.
      nl: >-
        Een AI-systeem dat is ingericht om doelen via meerdere stappen na te streven, vaak door acties te kiezen, tools te gebruiken en state bij te houden met beperkte directe prompting.
    why:
      en: >-
        A system can do more on its own. That does not tell us what it should do in a learning process.
      nl: >-
        Meer technische handelingsruimte bepaalt niet welke onderwijshandelingen zouden moeten worden gedelegeerd.
    practical_use:
      en: >-
        Evaluate each delegated action against the core learning action and the required human authority.
      nl: >-
        Beoordeel iedere gedelegeerde actie ten opzichte van de kernhandeling en de vereiste menselijke beslissingsruimte.
    related: [agency, education_in_the_loop]
  - id: ai_drift
    term: {en: AI Drift, nl: AI-drift}
    label: eai_meaning
    position: shared
    definition:
      en: >-
        A gradual shift in which the focus, intent or distribution of action within a task changes while its outward form still appears correct. Cognitive, decisional or regulatory actions may progressively move to AI without any single step clearly appearing to be a takeover.
      nl: >-
        Een geleidelijke verschuiving waarbij de focus, intentie of handelingsverdeling van een taak verandert terwijl de vorm ogenschijnlijk correct blijft. Denk-, keuze- of regulatiehandelingen kunnen stap voor stap naar AI verschuiven zonder dat één afzonderlijke stap duidelijk als overname aanvoelt.
    why:
      en: >-
        Small changes in AI use can accumulate until the activity is educationally different from the task that was originally designed.
      nl: >-
        Kleine verschuivingen in AI-gebruik kunnen zich opstapelen totdat de activiteit onderwijskundig iets anders is geworden dan oorspronkelijk ontworpen.
    practical_use:
      en: >-
        Compare the intended and actual division of work at several moments in the activity.
      nl: Vergelijk op meerdere momenten de bedoelde en feitelijke taakverdeling.
    related: [task_density, cognitive_displacement, didactic_distortion]
  - id: ai_support
    term: {en: AI Support, nl: AI-ondersteuning}
    label: common_term
    position: education_led
    definition:
      en: >-
        AI assistance that contributes to a task or learning process without taking over the core learning action that must remain with the learner.
      nl: >-
        AI-hulp die bijdraagt aan een taak of leerproces zonder de kernhandeling over te nemen die bij de leerling moet blijven.
    why:
      en: >-
        The amount of help does not determine whether something is support. Its function relative to the core learning action does.
      nl: >-
        Niet de hoeveelheid hulp bepaalt of iets ondersteuning is. De functie van die hulp ten opzichte van de kernhandeling doet dat.
    practical_use:
      en: >-
        Define the core learning action first; then decide which AI help is genuinely supportive.
      nl: >-
        Bepaal eerst de kernhandeling en besluit daarna welke AI-hulp daadwerkelijk ondersteunt.
  - id: alignment
    term: {en: Alignment, nl: Alignment / afstemming}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Constructive alignment: educational alignment between intended learning outcomes, learning activities and assessment.
        nl: >-
          Constructive alignment: onderwijskundige afstemming tussen leerdoelen, leeractiviteiten en toetsing.
      system:
        en: >-
          AI alignment: technical and governance work intended to make system behaviour conform to specified goals, values or constraints.
        nl: >-
          AI alignment: technisch en governancegericht werk om systeemgedrag te laten aansluiten op gespecificeerde doelen, waarden of grenzen.
    why:
      en: >-
        Same word. Different object. Aligning teaching is not the same as aligning a model.
      nl: >-
        Beide gaan over “alignment”, maar wat wordt afgestemd en welk bewijs nodig is verschilt fundamenteel.
    practical_use:
      en: >-
        Specify constructive alignment or AI alignment rather than using “alignment” alone.
      nl: >-
        Specificeer constructive alignment of AI alignment in plaats van alleen “alignment”.
  - id: answer_machine_era
    term: {en: Answer Machine Era, nl: Answer Machine Era}
    nl_translation: Tijdperk van de antwoordmachine
    label: eai_formalisation
    position: technology_led
    definition:
      en: >-
        An educational context in which answers are available almost instantly, fluently and persuasively, making the preceding process of search, friction, judgement and doubt less visible or less likely to occur.
      nl: >-
        Een onderwijscontext waarin antwoorden vrijwel onmiddellijk, vloeiend en overtuigend beschikbaar zijn, waardoor het voorafgaande proces van zoeken, frictie, afweging en twijfel minder zichtbaar of minder waarschijnlijk wordt.
    why:
      en: >-
        When answers arrive before a learner has noticed the problem, something important can disappear before it becomes part of learning.
      nl: >-
        Wanneer antwoorden verschijnen voordat een leerling het probleem zelf heeft opgemerkt, kan iets belangrijks verdwijnen voordat het onderdeel van leren wordt.
    practical_use:
      en: Protect moments in which no answer, route or question has yet been supplied.
      nl: Bescherm momenten waarop nog geen antwoord, route of vraag is aangeboden.
    related: [question_emergence, closure_bias, truth_apathy]
  - id: attention
    term: {en: Attention, nl: Aandacht}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human attention: the allocation of cognitive focus to information, a task, a question or an experience.
        nl: >-
          Menselijke aandacht: het richten van cognitieve focus op informatie, een taak, een vraag of een ervaring.
      system:
        en: >-
          System attention: a computational weighting mechanism used by models to relate representations or tokens.
        nl: >-
          Systeemaandacht: een computationeel wegingsmechanisme waarmee modellen relaties tussen representaties of tokens verwerken.
    why:
      en: Transformer attention is not human attention, even though the same word is used.
      nl: >-
        Transformer attention is geen menselijke aandacht, ook al wordt hetzelfde woord gebruikt.
    practical_use:
      en: >-
        Do not infer learner focus or engagement from a model mechanism called attention.
      nl: >-
        Leid leerlingfocus of betrokkenheid niet af uit een modelmechanisme dat attention heet.
  - id: authority
    term: {en: Authority, nl: Bevoegdheid}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human / professional authority: the legitimate right and responsibility to decide, intervene or determine consequences.
        nl: >-
          Menselijke / professionele bevoegdheid: het legitieme recht én de verantwoordelijkheid om te beslissen, in te grijpen of gevolgen te bepalen.
      system:
        en: >-
          System authority: technical permission or execution rights that allow a system to perform particular actions.
        nl: >-
          Systeembevoegdheid: technische rechten of permissies waarmee een systeem bepaalde handelingen kan uitvoeren.
    why:
      en: Permission to execute is not professional authority or responsibility.
      nl: >-
        Technische uitvoerrechten zijn geen professionele bevoegdheid of verantwoordelijkheid.
    practical_use:
      en: >-
        Separate who can execute an action from who is authorised and accountable for the decision.
      nl: >-
        Scheid wie technisch kan handelen van wie professioneel bevoegd en verantwoordelijk is.
  - id: autonomy
    term: {en: Autonomy, nl: Autonomie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Learner autonomy: meaningful room to make choices and regulate one’s own learning within relevant boundaries.
        nl: >-
          Leerlingautonomie: betekenisvolle ruimte om keuzes te maken en het eigen leren binnen relevante grenzen te reguleren.
      system:
        en: >-
          System autonomy: the degree to which an AI system can proceed without immediate human approval or intervention.
        nl: >-
          Systeemautonomie: de mate waarin een AI-systeem zonder directe menselijke goedkeuring of interventie kan doorgaan.
    why:
      en: More system autonomy is not more learner autonomy. It can even reduce it.
      nl: >-
        Meer systeemautonomie is niet hetzelfde als meer leerlingautonomie en kan die zelfs verkleinen.
    practical_use:
      en: Name whose autonomy is increasing or decreasing.
      nl: Benoem wiens autonomie toeneemt of afneemt.
  - id: capability
    term: {en: Capability, nl: Vermogen}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human capability: a person’s ability to perform a relevant action under defined conditions.
        nl: >-
          Menselijk vermogen: het vermogen van een persoon om onder bepaalde voorwaarden een relevante handeling uit te voeren.
      system:
        en: >-
          System capability: what a model or AI system can perform under specified tasks, tools and conditions.
        nl: >-
          Systeemvermogen: wat een model of AI-systeem onder gespecificeerde taken, tools en voorwaarden kan uitvoeren.
    why:
      en: >-
        Capability is not allocation. That AI can do something does not decide who should do it.
      nl: Vermogen is geen taakverdeling. Dat AI iets kan, bepaalt niet wie het moet doen.
    practical_use:
      en: 'Ask two questions separately: can AI do this, and should AI do this here?'
      nl: 'Stel twee vragen apart: kan AI dit, en moet AI dit hier doen?'
  - id: closure_bias
    term: {en: Closure Bias, nl: Closure Bias}
    label: eai_meaning
    position: technology_led
    definition:
      en: >-
        The tendency to experience a fluent and well-formed answer as complete. Its form suggests that the thinking is finished, making missing questions, assumptions and reasoning steps less visible.
      nl: >-
        De neiging om een vloeiend en afgerond antwoord als volledig te ervaren. De vorm suggereert dat het denken klaar is, waardoor ontbrekende vragen, aannames en denkstappen minder zichtbaar worden.
    why:
      en: >-
        A polished answer can close inquiry before the learner has discovered what is still missing.
      nl: >-
        Een afgerond antwoord kan het onderzoek sluiten voordat de leerling heeft ontdekt wat nog ontbreekt.
    distinction:
      en: >-
        Closure Bias concerns the closing effect of a finished answer; Illusion of Completeness concerns the impression that the content itself is complete.
      nl: >-
        Closure Bias gaat over het afsluitende effect van een afgerond antwoord; Illusie van volledigheid over de indruk dat de inhoud zelf volledig is.
    practical_use:
      en: >-
        Reopen a finished answer: what is missing, assumed, uncertain or insufficiently checked?
      nl: >-
        Open een afgerond antwoord opnieuw: wat ontbreekt, wordt aangenomen, is onzeker of onvoldoende gecontroleerd?
    related: [illusion_of_completeness, sycophantic_completion, truth_apathy]
  - id: cognitive_displacement
    term: {en: Cognitive Displacement, nl: Cognitieve verplaatsing}
    label: eai_meaning
    position: shared
    definition:
      en: >-
        The shifting of relevant cognitive or learning actions from the learner to the AI system, reducing the learner’s opportunity to practise and develop those actions independently.
      nl: >-
        Het verschuiven van relevante denk- of leerhandelingen van de leerling naar het AI-systeem, waardoor de leerling minder gelegenheid krijgt om die handelingen zelf te oefenen en te ontwikkelen.
    why:
      en: >-
        Efficiency is not neutral when the work that disappears is precisely the work the learner needs to develop.
      nl: >-
        Efficiëntie is niet neutraal wanneer juist het werk verdwijnt dat de leerling moet ontwikkelen.
    distinction:
      en: >-
        Cognitive offloading can be useful; cognitive displacement becomes educationally relevant when the work that moves is itself part of what should be learned.
      nl: >-
        Cognitive offloading kan functioneel zijn; cognitieve verplaatsing wordt onderwijskundig relevant wanneer juist het verplaatste werk onderdeel is van wat geleerd moet worden.
    practical_use:
      en: Identify the core learning action first, then check who actually performs it.
      nl: >-
        Bepaal eerst de kernhandeling en controleer daarna wie die handeling feitelijk uitvoert.
    related: [task_density, reverse_scaffolding, oversupport]
  - id: cognitive_offloading
    term: {en: Cognitive Offloading, nl: Cognitieve uitbesteding}
    label: common_term
    position: education_native
    definition:
      en: >-
        Using external tools or representations to reduce the amount of cognitive work that must be carried internally.
      nl: >-
        Externe hulpmiddelen of representaties gebruiken om de hoeveelheid denkwerk die intern moet worden uitgevoerd te verminderen.
    why:
      en: >-
        Offloading can be useful; the educational question is whether the offloaded action is itself something the learner needs to develop.
      nl: >-
        Uitbesteding kan functioneel zijn; de onderwijskundige vraag is of juist de uitbestede handeling ontwikkeld moet worden.
    practical_use:
      en: >-
        Compare the offloaded action with the core learning action before deciding whether offloading is desirable.
      nl: >-
        Vergelijk de uitbestede handeling met de kernhandeling voordat je bepaalt of uitbesteding wenselijk is.
  - id: confidence
    term: {en: Confidence, nl: Zekerheid}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human confidence: a person’s degree of certainty in their own knowledge, judgement or answer.
        nl: >-
          Menselijke zekerheid: de mate waarin iemand vertrouwen heeft in eigen kennis, oordeel of antwoord.
      system:
        en: >-
          System confidence: a numerical or derived estimate associated with a model output, prediction or decision.
        nl: >-
          Systeemconfidence: een numerieke of afgeleide inschatting die aan een modeloutput, voorspelling of beslissing wordt gekoppeld.
    why:
      en: >-
        Model confidence is not learner confidence, and neither is automatically evidence of correctness.
      nl: >-
        Modelconfidence is geen leerlingzekerheid, en geen van beide is automatisch bewijs van juistheid.
    practical_use:
      en: Keep human certainty, model confidence and evidence quality separate.
      nl: Houd menselijke zekerheid, modelconfidence en kwaliteit van bewijs uit elkaar.
  - id: context
    term: {en: Context, nl: Context}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Educational context: the task, prior knowledge, subject, social setting and circumstances that shape meaning and learning.
        nl: >-
          Onderwijscontext: taak, voorkennis, vak, sociale setting en omstandigheden die betekenis en leren mede bepalen.
      system:
        en: >-
          System context: information made available to a model or agent during the current processing state or interaction.
        nl: >-
          Systeemcontext: informatie die tijdens de actuele verwerking of interactie beschikbaar is voor een model of agent.
    why:
      en: >-
        More system context does not mean richer learner understanding or better educational context.
      nl: >-
        Meer systeemcontext betekent niet meer begrip of een rijkere onderwijscontext voor de leerling.
    practical_use:
      en: >-
        Specify whether context refers to the learner situation or to information available to the system.
      nl: >-
        Benoem of context slaat op de leersituatie of op informatie die het systeem actief kan gebruiken.
    eai_refs:
      definitions: [context]
  - id: context_window
    term: {en: Context Window, nl: Contextvenster}
    label: common_term
    position: technology_native
    definition:
      en: >-
        The amount of information a model can actively take into account during a given interaction or processing step.
      nl: >-
        De hoeveelheid informatie die een model tijdens een interactie of verwerkingsstap actief kan meenemen.
    why:
      en: More system context is not more human memory, understanding or retention.
      nl: >-
        Een contextvenster is een technische capaciteit, geen menselijk geheugen, begrip of retentie.
    practical_use:
      en: >-
        Reintroduce essential goals, constraints and evidence when long interactions risk dropping relevant context.
      nl: >-
        Breng essentiële doelen, grenzen en bewijs opnieuw in wanneer lange interacties relevante context kunnen verliezen.
  - id: controlled_detachment
    term: {en: Controlled Detachment, nl: Controlled Detachment}
    nl_translation: Gecontroleerde ontkoppeling
    label: eai_formalisation
    position: education_led
    definition:
      en: >-
        The deliberate and temporary removal of relevant AI support to determine whether the learner can now perform the core learning action independently.
      nl: >-
        Het doelgericht en tijdelijk wegnemen van relevante AI-ondersteuning om zichtbaar te maken of de leerling de kernhandeling inmiddels zelfstandig kan uitvoeren.
    why:
      en: >-
        Performance with support does not show what remains available without that support.
      nl: >-
        Presteren met ondersteuning laat niet zien wat zonder die ondersteuning zelfstandig beschikbaar blijft.
    practical_use:
      en: >-
        Remove the relevant support for a comparable task and observe what the learner can still do.
      nl: >-
        Neem bij een vergelijkbare taak de relevante ondersteuning weg en observeer wat de leerling nog zelf kan.
    related: [independent_evidence, reverse_scaffolding, reflective_re_entry]
    eai_refs:
      identifiers: [EV-03, REM-01, REM-02]
  - id: core_learning_action
    term: {en: Core Learning Action, nl: Kernhandeling}
    label: eai_term
    position: education_native
    definition:
      en: >-
        The step to which the learner must personally give substantive meaning at a given stage for learning to occur.
      nl: >-
        De stap waaraan de leerling in een bepaalde fase zelf inhoudelijke betekenis moet geven om tot leren te komen.
    why:
      en: >-
        Without a core learning action, “AI may support but not replace” remains an empty rule because it is unclear what must not be replaced.
      nl: >-
        Zonder kernhandeling blijft “AI mag ondersteunen maar niet overnemen” een lege regel, omdat niet duidelijk is wat niet mag worden overgenomen.
    distinction:
      en: >-
        The core learning action is not necessarily the hardest, longest or most visible step.
      nl: >-
        De kernhandeling is niet automatisch de moeilijkste, langste of meest zichtbare stap.
    practical_use:
      en: Determine the core learning action before deciding what AI may do.
      nl: Bepaal de kernhandeling voordat wordt besloten wat AI mag doen.
    related: [task_density, meaning_making_vs_addition, support_replacement_boundary]
    eai_refs:
      proposal_concepts: [core_learning_action]
      definitions: [core_human_action]
  - id: creativity
    term: {en: Creativity, nl: Creativiteit}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human creativity: generating, shaping and evaluating ideas or artefacts in relation to intention, meaning and context.
        nl: >-
          Menselijke creativiteit: ideeën of producten genereren, vormen en beoordelen in relatie tot bedoeling, betekenis en context.
      system:
        en: >-
          System creativity: a label often used for generative novelty, variation or recombination in model output.
        nl: >-
          Systeemcreativiteit: een label dat vaak wordt gebruikt voor nieuwheid, variatie of recombinatie in gegenereerde output.
    why:
      en: Novel output and a human creative process are not the same construct.
      nl: Nieuwe output en een menselijk creatief proces zijn niet hetzelfde construct.
    practical_use:
      en: When creativity matters, identify which creative decisions must remain human.
      nl: >-
        Als creativiteit ertoe doet, bepaal welke creatieve beslissingen bij de mens moeten blijven.
  - id: decision_making
    term: {en: Decision-Making, nl: Besluitvorming}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human decision-making: weighing information, reasons and consequences in order to choose a course of action.
        nl: >-
          Menselijke besluitvorming: informatie, redenen en gevolgen wegen om tot een handelingskeuze te komen.
      system:
        en: >-
          System decision-making: technical selection of an output, action or route according to rules, objectives or model behaviour.
        nl: >-
          Systeembesluitvorming: technische selectie van output, handeling of route op basis van regels, doelen of modelgedrag.
    why:
      en: Automated selection is not automatically professional decision-making.
      nl: Geautomatiseerde selectie is niet automatisch professionele besluitvorming.
    practical_use:
      en: Mark where decision authority and responsibility must remain with a person.
      nl: >-
        Markeer waar beslissingsbevoegdheid en verantwoordelijkheid bij een persoon moeten blijven.
  - id: didactic_controllability
    term: {en: Didactic Controllability, nl: Didactische controleerbaarheid}
    label: eai_term
    position: education_led
    definition:
      en: >-
        The extent to which it remains visible and checkable who made the learning-relevant decisions and did the cognitive work that matters, and whether the learner can reconstruct, explain and justify that work.
      nl: >-
        De mate waarin zichtbaar en controleerbaar blijft wie de leerrelevante keuzes en denkhandelingen heeft uitgevoerd, en of de leerling die handelingen kan reconstrueren, uitleggen en verantwoorden.
    why:
      en: >-
        If the relevant human action disappears from view, teachers can no longer reliably interpret what an AI-assisted product says about learning.
      nl: >-
        Wanneer de relevante menselijke handeling uit beeld verdwijnt, kan een docent niet meer betrouwbaar interpreteren wat een AI-ondersteund product over leren zegt.
    practical_use:
      en: Design evidence that keeps choices, judgements and corrections inspectable.
      nl: Ontwerp bewijs waardoor keuzes, afwegingen en correcties inspecteerbaar blijven.
    related: [task_density, justification_mapping, process_evidence, trace_back_prompting]
    eai_refs:
      proposal_concepts: [didactic_controllability]
  - id: didactic_distortion
    term: {en: Didactic Distortion, nl: Didactische vervorming}
    label: eai_term
    position: education_led
    definition:
      en: >-
        A shift in which the visible form of a learning activity largely remains intact while its educational meaning changes because a relevant action, decision or judgement is no longer performed by the learner.
      nl: >-
        Een verschuiving waarbij de zichtbare vorm van een leeractiviteit grotendeels intact blijft, terwijl de onderliggende onderwijsbetekenis verandert doordat een relevante handeling, keuze of afweging niet langer door de leerling wordt uitgevoerd.
    why:
      en: >-
        The assignment can look unchanged while AI has quietly changed what the learner actually practises.
      nl: >-
        De opdracht kan er hetzelfde uitzien terwijl AI stilletjes heeft veranderd wat de leerling feitelijk oefent.
    practical_use:
      en: >-
        Compare the original learner action with the action that remains after AI is added.
      nl: >-
        Vergelijk de oorspronkelijke leerlinghandeling met wat na toevoeging van AI nog bij de leerling ligt.
    related: [ai_drift, cognitive_displacement, task_density]
  - id: education_in_the_loop
    term: {en: Education in the Loop (EITL), nl: Education in the Loop (EITL)}
    nl_translation: Onderwijs in de beslislus (EITL)
    label: eai_term
    position: education_led
    definition:
      en: >-
        The principle that educational intent remains an active part of an AI system’s decisions and boundaries. Learning goals, core learning actions, evidence requirements and human authority are built into the design rather than checked only afterwards.
      nl: >-
        Het principe dat de pedagogisch-didactische bedoeling actief onderdeel blijft van de beslissingen en grenzen van een AI-systeem. Leerdoel, kernhandeling, bewijs en menselijke beslissingsruimte worden vooraf in het ontwerp verwerkt en niet alleen achteraf gecontroleerd.
    why:
      en: >-
        A human in the loop is not enough if the educational logic itself was never part of the system’s design.
      nl: >-
        Een mens in de beslislus is niet genoeg wanneer de onderwijslogica zelf nooit onderdeel van het systeemontwerp was.
    practical_use:
      en: >-
        Set learning goals, protected actions, evidence and intervention boundaries before configuring the technology.
      nl: >-
        Leg leerdoelen, beschermde handelingen, bewijs en interventiegrenzen vast vóór de technische inrichting.
    related: [core_learning_action, task_density, didactic_controllability, human_in_the_loop]
    eai_refs:
      proposal_concepts: [education_in_the_loop]
  - id: evaluation
    term: {en: Evaluation, nl: Evaluatie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human evaluation: judging quality, progress or suitability against criteria as part of learning or professional practice.
        nl: >-
          Menselijke evaluatie: kwaliteit, voortgang of geschiktheid beoordelen aan de hand van criteria binnen leren of professioneel handelen.
      system:
        en: >-
          System evaluation: automated scoring, ranking, critique or checking performed by a model or evaluator.
        nl: >-
          Systeemevaluatie: geautomatiseerd scoren, rangschikken, bekritiseren of controleren door een model of evaluator.
    why:
      en: >-
        An evaluator can produce a score or critique without performing professional judgement in the human sense.
      nl: >-
        Een evaluator kan een score of kritiek produceren zonder professioneel oordeel in menselijke zin.
    practical_use:
      en: >-
        Separate who sets the criteria, who applies them and who interprets the consequence.
      nl: >-
        Scheid wie de criteria bepaalt, wie ze toepast en wie de consequentie interpreteert.
  - id: evidence_function_shift
    term: {en: Evidence-Function Shift, nl: Evidence-Function Shift}
    nl_translation: Verschuiving van de bewijsfunctie
    label: eai_formalisation
    position: shared
    definition:
      en: >-
        The shift by which, under generative AI, a final product becomes a less reliable indicator of the thinking and learning process that preceded it.
      nl: >-
        De verandering waardoor een eindproduct onder generatieve AI minder betrouwbaar wordt als aanwijzing voor het denk- en leerproces dat eraan voorafging.
    why:
      en: >-
        A product can remain excellent while the inference “the learner must therefore have done the thinking” becomes weaker.
      nl: >-
        Een product kan uitstekend blijven terwijl de gevolgtrekking “dus de leerling heeft het denkwerk gedaan” minder houdbaar wordt.
    practical_use:
      en: >-
        Reconsider what a product can still prove and add process or independent evidence where needed.
      nl: >-
        Herzie wat een product nog kan bewijzen en voeg waar nodig proces- of zelfstandig bewijs toe.
    related: [learning_evidence, output_evidence, process_evidence, independent_evidence]
    eai_refs:
      proposal_concepts: [evidence_function_shift]
  - id: explainability
    term: {en: Explainability, nl: Uitlegbaarheid}
    label: common_term
    position: technology_led
    definition:
      en: >-
        The extent to which relevant system outputs, factors or behaviour can be explained in a form that people can understand and use.
      nl: >-
        De mate waarin relevante systeemuitkomsten, factoren of gedrag kunnen worden uitgelegd in een vorm die mensen kunnen begrijpen en gebruiken.
    why:
      en: >-
        An explanation can improve understanding of a system without showing whether the learner performed the intended cognitive work.
      nl: >-
        Een uitleg kan het systeem begrijpelijker maken zonder te laten zien of de leerling het bedoelde denkwerk heeft uitgevoerd.
    practical_use:
      en: >-
        Use explainability for system understanding and Didactic Controllability for learning-relevant human-system attribution.
      nl: >-
        Gebruik uitlegbaarheid voor begrip van het systeem en Didactische controleerbaarheid voor leerrelevante toeschrijving tussen mens en systeem.
    related: [didactic_controllability]
  - id: feedback
    term: {en: Feedback, nl: Feedback}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Pedagogical feedback: information intended to help a learner understand current performance and take a next learning step.
        nl: >-
          Pedagogische feedback: informatie die een leerling helpt de huidige prestatie te begrijpen en een volgende leerstap te zetten.
      system:
        en: >-
          Technical feedback: a signal returned to a system or control loop to modify subsequent behaviour.
        nl: >-
          Technische feedback: een signaal dat aan een systeem of regellus wordt teruggegeven om vervolggedrag te beïnvloeden.
    why:
      en: >-
        Same word. Different loop. Feedback for a learner is not feedback in a control system.
      nl: >-
        De twee betekenissen delen een woord maar verschillen in doel, actor en bewijs van effect.
    practical_use:
      en: Identify whether feedback is for learner regulation or system control.
      nl: Benoem of feedback bedoeld is voor leerlingregulatie of systeemsturing.
  - id: generalisation
    term: {en: Generalisation, nl: Generalisatie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human generalisation: using an idea, principle or skill beyond the specific examples in which it was learned.
        nl: >-
          Menselijke generalisatie: een idee, principe of vaardigheid kunnen gebruiken buiten de specifieke voorbeelden waarin het is geleerd.
      system:
        en: >-
          Model generalisation: system performance on inputs, tasks or conditions not identical to its training examples.
        nl: >-
          Modelgeneralisatie: systeemprestatie op inputs, taken of omstandigheden die niet identiek zijn aan trainingsvoorbeelden.
    why:
      en: Model generalisation is not evidence of learner transfer or generalisation.
      nl: >-
        Modelgeneralisatie is geen bewijs van leertransfer of generalisatie bij de leerling.
    practical_use:
      en: Test learner generalisation and model generalisation separately.
      nl: Toets generalisatie van de leerling en van het model afzonderlijk.
  - id: goal
    term: {en: Goal, nl: Doel}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Educational / human goal: the intended knowledge, skill, understanding, action or outcome that gives direction to learning or professional work.
        nl: >-
          Onderwijs- / menselijk doel: de beoogde kennis, vaardigheid, het begrip, handelen of resultaat dat richting geeft aan leren of professioneel werk.
      system:
        en: >-
          System goal: an objective, instruction, reward criterion or target that directs model or agent behaviour.
        nl: >-
          Systeemdoel: een objective, instructie, rewardcriterium of target dat model- of agentgedrag stuurt.
    why:
      en: A system can optimise its goal while bypassing the learning goal.
      nl: Een systeem kan zijn doel optimaliseren en tegelijk het leerdoel omzeilen.
    practical_use:
      en: Write the learning goal and the system goal separately before configuring AI.
      nl: Schrijf leerdoel en systeemdoel afzonderlijk op voordat AI wordt ingericht.
    eai_refs:
      definitions: [goal]
  - id: hallucination
    term: {en: Hallucination, nl: Hallucinatie}
    label: common_term
    position: technology_native
    definition:
      en: >-
        A model output that presents unsupported, fabricated or otherwise ungrounded content as if it were a plausible answer.
      nl: >-
        Modeloutput waarin onbevestigde, verzonnen of anderszins ongegronde inhoud als plausibel antwoord wordt gepresenteerd.
    why:
      en: >-
        Hallucination is a model-output problem. It becomes an educational problem when learners must judge, use or trust the output.
      nl: >-
        Hallucinatie is een systeemoutputprobleem; of het een leerprobleem wordt hangt af van hoe de output wordt gebruikt en gecontroleerd.
    practical_use:
      en: >-
        Treat source checking and epistemic verification as separate educational actions rather than assuming the model will self-correct.
      nl: >-
        Behandel broncontrole en epistemische verificatie als afzonderlijke onderwijsactiviteiten in plaats van te veronderstellen dat het model zichzelf corrigeert.
  - id: human_in_the_loop
    term: {en: Human in the Loop (HITL), nl: Human in the Loop (HITL)}
    nl_translation: Mens in de beslislus (HITL)
    label: common_term
    position: technology_led
    definition:
      en: >-
        A system design pattern in which a human reviews, approves, corrects or intervenes in part of an automated process.
      nl: >-
        Een systeemontwerp waarin een mens een deel van een geautomatiseerd proces beoordeelt, goedkeurt, corrigeert of kan onderbreken.
    why:
      en: >-
        Human presence in a workflow does not automatically mean that educational intent governs the workflow.
      nl: >-
        Menselijke aanwezigheid in een workflow betekent niet automatisch dat de onderwijsbedoeling de workflow stuurt.
    practical_use:
      en: >-
        Distinguish human oversight from Education in the Loop: who defines the goals, boundaries and evidence requirements?
      nl: >-
        Maak onderscheid tussen menselijk toezicht en Education in the Loop: wie bepaalt doelen, grenzen en bewijsvereisten?
    related: [education_in_the_loop]
  - id: human_ai_collaboration
    term: {en: Human-AI Collaboration, nl: Mens-AI-samenwerking}
    label: common_term
    position: shared
    definition:
      en: >-
        A coordinated activity in which human and AI contributions interact within the same task or process and each side affects what the other can do next.
      nl: >-
        Een gecoördineerde activiteit waarin menselijke en AI-bijdragen binnen dezelfde taak of hetzelfde proces op elkaar ingrijpen en elkaars volgende stap beïnvloeden.
    why:
      en: >-
        Collaboration is a relational construct here: it cannot be defined from only the human side or only the system side.
      nl: >-
        Samenwerking is hier een relationeel construct: het kan niet alleen vanuit de mens of alleen vanuit het systeem worden gedefinieerd.
    practical_use:
      en: >-
        Make the division of work, authority and evidence explicit rather than calling any interaction “collaboration”.
      nl: >-
        Maak taakverdeling, bevoegdheid en bewijs expliciet in plaats van iedere interactie samenwerking te noemen.
  - id: illusion_of_completeness
    term: {en: Illusion of Completeness, nl: Illusie van volledigheid}
    label: eai_meaning
    position: technology_led
    definition:
      en: >-
        The impression that an answer is substantively complete because it is presented coherently and conclusively, even though relevant perspectives, uncertainties, conditions or questions may be missing.
      nl: >-
        De indruk dat een antwoord inhoudelijk volledig is doordat het samenhangend en afgerond wordt gepresenteerd, terwijl relevante perspectieven, onzekerheden, voorwaarden of vragen kunnen ontbreken.
    why:
      en: Form can simulate completeness even when the underlying knowledge is partial.
      nl: Vorm kan volledigheid suggereren terwijl de onderliggende kennis onvolledig is.
    practical_use:
      en: Ask what perspectives, exceptions, uncertainties or conditions are absent.
      nl: >-
        Vraag welke perspectieven, uitzonderingen, onzekerheden of voorwaarden ontbreken.
    related: [closure_bias, pseudo_complexity]
  - id: independent_evidence
    term: {en: Independent Evidence, nl: Bewijs van zelfstandige beheersing}
    label: eai_formalisation
    position: education_led
    definition:
      en: >-
        Evidence showing what a learner can independently perform, explain, judge or reconstruct without the relevant AI support.
      nl: >-
        Bewijs dat laat zien wat een leerling zonder de relevante AI-ondersteuning zelf kan uitvoeren, uitleggen, beoordelen of reconstrueren.
    why:
      en: >-
        Supported performance and independent availability are different claims and require different evidence.
      nl: >-
        Ondersteunde prestatie en zelfstandige beschikbaarheid zijn verschillende claims en vragen om verschillend bewijs.
    practical_use:
      en: Use a new or comparable task without the earlier content-bearing AI support.
      nl: >-
        Gebruik een nieuwe of vergelijkbare taak zonder de eerdere inhoudelijk dragende AI-steun.
    related: [controlled_detachment, learning_evidence, process_evidence]
    eai_refs:
      definitions: [independent_mastery]
      identifiers: [EV-03, EV-10]
  - id: inference
    term: {en: Inference, nl: Gevolgtrekking}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human inference: drawing a conclusion from observations, reasons, evidence or prior knowledge.
        nl: >-
          Menselijke gevolgtrekking: een conclusie afleiden uit waarnemingen, redenen, bewijs of voorkennis.
      system:
        en: >-
          System inference: technical execution in which a trained model produces outputs from inputs; in some contexts, the term also refers to statistical inference.
        nl: >-
          Systeeminference: technische uitvoering waarbij een getraind model op basis van input output produceert; in sommige contexten betekent inference ook statistische gevolgtrekking.
    why:
      en: Model inference and human inference share a word, not a cognitive construct.
      nl: >-
        Modelinference en menselijke gevolgtrekking delen een woord, niet hetzelfde cognitieve construct.
    practical_use:
      en: State whether inference refers to human reasoning or model execution.
      nl: >-
        Benoem expliciet of inference slaat op menselijk redeneren of op modeluitvoering.
  - id: intelligence
    term: {en: Intelligence, nl: Intelligentie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human intelligence: a broad family of human cognitive capacities involved in understanding, learning, reasoning and adapting.
        nl: >-
          Menselijke intelligentie: een brede familie van menselijke cognitieve vermogens die betrokken zijn bij begrijpen, leren, redeneren en aanpassen.
      system:
        en: >-
          Artificial intelligence: an umbrella term for technical systems that perform tasks associated with perception, prediction, generation, reasoning or action.
        nl: >-
          Artificiële intelligentie: een verzamelterm voor technische systemen die taken uitvoeren die worden geassocieerd met waarnemen, voorspellen, genereren, redeneren of handelen.
    why:
      en: >-
        The shared word can make task performance look like evidence of the same underlying kind of intelligence.
      nl: >-
        Het gedeelde woord kan taakprestatie laten lijken op bewijs van hetzelfde soort onderliggende intelligentie.
    practical_use:
      en: Prefer the specific capability or human construct when the distinction matters.
      nl: >-
        Gebruik waar mogelijk het specifieke vermogen of construct waar je werkelijk over spreekt.
  - id: judgement
    term: {en: Judgement, nl: Oordeel}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human / professional judgement: a context-sensitive evaluation in which a person weighs evidence, criteria and consequences and remains responsible for the conclusion.
        nl: >-
          Menselijk / professioneel oordeel: een contextgevoelige beoordeling waarbij iemand bewijs, criteria en gevolgen weegt en verantwoordelijk blijft voor de conclusie.
      system:
        en: >-
          Automated judgement: an operational label for system scoring, classification, ranking or recommendation.
        nl: >-
          Geautomatiseerd oordeel: een operationeel label voor een score, classificatie, rangschikking of aanbeveling van een systeem.
    why:
      en: >-
        An AI recommendation or score is not professional judgement merely because it produces a conclusion.
      nl: >-
        Een AI-aanbeveling of score is niet automatisch professioneel oordeel omdat er een conclusie uitkomt.
    practical_use:
      en: >-
        Identify who owns the criteria, interpretation and consequences of the judgement.
      nl: Benoem wie eigenaar is van criteria, interpretatie en gevolgen van het oordeel.
  - id: justification_mapping
    term: {en: Justification Mapping, nl: Justification Mapping}
    nl_translation: Verantwoordingsmapping
    label: eai_term
    position: education_led
    definition:
      en: >-
        A structured method for making visible what the learner asked AI, what AI proposed, what the learner accepted, modified or rejected, and why.
      nl: >-
        Een gestructureerde manier om zichtbaar te maken wat de leerling aan AI vroeg, wat AI voorstelde, wat de leerling overnam, aanpaste of verwierp, en waarom.
    why:
      en: >-
        A prompt log shows interaction; it does not by itself show judgement or ownership of the resulting decisions.
      nl: >-
        Een promptlog toont interactie, maar nog niet de afweging of het eigenaarschap achter de uiteindelijke keuzes.
    practical_use:
      en: 'Record for each relevant AI contribution: proposal, learner action and reason.'
      nl: >-
        Leg per relevante AI-bijdrage vast: voorstel, handeling van de leerling en reden.
    related: [trace_back_prompting, didactic_controllability, process_evidence]
    eai_refs:
      identifiers: [EV-08]
  - id: knowledge
    term: {en: Knowledge, nl: Kennis}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human knowledge: organised, retained and usable understanding or information available to a person.
        nl: >-
          Menselijke kennis: georganiseerde, behouden en bruikbare kennis of begrip waarover een persoon beschikt.
      system:
        en: >-
          System knowledge: a shorthand for information represented in model parameters, external stores, retrieved sources or active context.
        nl: >-
          Systeemkennis: een verkorte aanduiding voor informatie in modelparameters, externe opslag, opgehaalde bronnen of actieve context.
    why:
      en: Stored or retrieved information is not the same construct as human knowledge.
      nl: >-
        Opgeslagen of opgehaalde informatie is niet hetzelfde construct als menselijke kennis.
    practical_use:
      en: Do not infer learner knowledge from what the system can retrieve or generate.
      nl: Leid leerlingkennis niet af uit wat het systeem kan ophalen of genereren.
  - id: learning
    term: {en: Learning, nl: Leren}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human learning: change in knowledge, skill, understanding or regulation that remains available to the learner beyond the supported moment.
        nl: >-
          Menselijk leren: duurzame verandering in kennis, vaardigheid, begrip of regulatie die beschikbaar komt voor de leerling.
      system:
        en: >-
          Machine learning: technical optimisation in which model parameters or system behaviour are changed from data or feedback.
        nl: >-
          Machine learning: technische optimalisatie waarbij modelparameters of systeemgedrag op basis van data of feedback worden aangepast.
    why:
      en: >-
        A model can “learn” while no learner learns anything. Same verb. Different process.
      nl: >-
        Dat een systeem “leert” is geen bewijs dat een leerling leert; hetzelfde werkwoord verwijst naar fundamenteel verschillende processen.
    practical_use:
      en: >-
        Specify human learning or machine learning instead of using the unqualified word when ambiguity matters.
      nl: Specificeer menselijk leren of machine learning wanneer ambiguïteit ertoe doet.
  - id: learning_evidence
    term: {en: Learning Evidence, nl: Bewijs van leren}
    label: eai_term
    position: education_native
    definition:
      en: >-
        Observable information that supports a defensible claim about what the learner has learned. Its evidential value depends on its relation to the core learning action; product quality alone is insufficient.
      nl: >-
        Waarneembare informatie die een verdedigbare uitspraak mogelijk maakt over wat de leerling heeft geleerd. De bewijskracht hangt af van de relatie met de kernhandeling; productkwaliteit alleen is onvoldoende.
    why:
      en: AI makes it easier to confuse evidence of a product with evidence of learning.
      nl: >-
        AI maakt het makkelijker om bewijs van een product te verwarren met bewijs van leren.
    practical_use:
      en: >-
        Decide in advance which observable behaviour or performance may support the learning claim.
      nl: >-
        Bepaal vooraf welk waarneembaar gedrag of welke prestatie de leerclaim mag ondersteunen.
    related: [evidence_function_shift, output_evidence, process_evidence, independent_evidence]
    eai_refs:
      definitions: [human_evidence, evidence_claim]
  - id: mastery
    term: {en: Mastery, nl: Beheersing}
    label: common_term
    position: education_native
    definition:
      en: >-
        The learner’s sufficiently reliable and independent command of target knowledge, a target skill or a core learning action under appropriate conditions.
      nl: >-
        De voldoende betrouwbare en zelfstandige beheersing door de leerling van beoogde kennis, vaardigheid of kernhandeling onder passende omstandigheden.
    why:
      en: Successful autonomous system execution is not learner mastery.
      nl: >-
        Succesvolle autonome uitvoering door een systeem is geen beheersing door de leerling.
    practical_use:
      en: >-
        Use independent evidence rather than supported output to make claims about mastery.
      nl: >-
        Gebruik zelfstandig bewijs in plaats van ondersteunde output voor uitspraken over beheersing.
  - id: meaning_making_vs_addition
    term: {en: Meaning-Making vs Addition, nl: Betekenis geven versus toevoegen}
    label: eai_formalisation
    position: education_native
    definition:
      en: >-
        The difference between visibly adding something to a product and doing the meaning-making that matters for learning. Editing, choosing or rewriting is not automatically evidence that the learner made the underlying judgement.
      nl: >-
        Het onderscheid tussen zichtbaar iets aan een product toevoegen en zelf inhoudelijke betekenis geven aan de handeling die voor het leren relevant is. Aanpassen, kiezen of herschrijven is niet automatisch bewijs dat de leerling de onderliggende afweging zelf heeft gemaakt.
    why:
      en: >-
        “The learner added something” is a weak criterion if the meaningful decision had already been made by AI.
      nl: >-
        “De leerling heeft iets toegevoegd” is een zwak criterium wanneer de betekenisvolle beslissing al door AI was genomen.
    practical_use:
      en: >-
        Ask what the learner personally had to understand, decide or justify, not only what they edited.
      nl: >-
        Vraag wat de leerling zelf moest begrijpen, beslissen of verantwoorden, niet alleen wat hij of zij heeft aangepast.
    related: [core_learning_action, act_of_learning, process_evidence]
    eai_refs:
      proposal_concepts: [meaning_making_vs_addition]
  - id: memory
    term: {en: Memory, nl: Geheugen}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human memory: cognitive retention and later availability of knowledge or experience.
        nl: >-
          Menselijk geheugen: cognitieve retentie en latere beschikbaarheid van kennis of ervaring.
      system:
        en: >-
          System memory: stored or retrievable information, state or context that a system can reuse.
        nl: >-
          Systeemgeheugen: opgeslagen of opvraagbare informatie, state of context die een systeem opnieuw kan gebruiken.
    why:
      en: A system that stores information is not a learner who remembers.
      nl: Persistente opslag is niet hetzelfde construct als menselijke retentie.
    practical_use:
      en: Do not infer learner retention from what a system can remember or retrieve.
      nl: >-
        Leid retentie bij de leerling niet af uit wat een systeem kan onthouden of ophalen.
  - id: metacognition
    term: {en: Metacognition, nl: Metacognitie}
    label: common_term
    position: education_native
    definition:
      en: >-
        The learner’s knowledge and regulation of their own thinking and learning, including planning, monitoring and evaluation.
      nl: >-
        De kennis en regulatie van het eigen denken en leren, waaronder plannen, monitoren en evalueren.
    why:
      en: A model checking its output is not a learner monitoring their own thinking.
      nl: >-
        Systeemzelfcontrole kan metacognitie ondersteunen, maar is niet zelf de metacognitie van de leerling.
    practical_use:
      en: >-
        Keep the learner’s own monitoring and evaluation visible when AI provides reflective prompts or checks.
      nl: >-
        Houd de eigen monitoring en evaluatie van de leerling zichtbaar wanneer AI reflectieve prompts of controles geeft.
  - id: observation
    term: {en: Observation, nl: Waarneming}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human observation: noticing and interpreting relevant features of a situation, source, phenomenon or learner response.
        nl: >-
          Menselijke waarneming: relevante kenmerken in een situatie, bron, verschijnsel of leerlingreactie opmerken en interpreteren.
      system:
        en: >-
          System observation: detection, sensing, extraction or classification of information available to a technical system.
        nl: >-
          Systeemwaarneming: detectie, sensing, extractie of classificatie van informatie die voor een technisch systeem beschikbaar is.
    why:
      en: System detection is not the same construct as human observation.
      nl: Systeemdetectie is niet hetzelfde construct als menselijke waarneming.
    practical_use:
      en: >-
        If noticing is part of the core learning action, do not let AI pre-label what the learner is meant to observe.
      nl: >-
        Als het opmerken zelf de kernhandeling is, laat AI niet vooraf labelen wat de leerling moet waarnemen.
  - id: output_evidence
    term: {en: Output Evidence, nl: Outputbewijs}
    label: eai_formalisation
    position: education_led
    definition:
      en: >-
        Information derived from the final product or performance. It shows what was produced, but not automatically who performed the relevant cognitive work or what the learner learned.
      nl: >-
        Informatie die uit het eindproduct of de uiteindelijke prestatie wordt afgeleid. Zij laat zien wat is geproduceerd, maar niet automatisch wie het relevante denkwerk uitvoerde of wat de leerling heeft geleerd.
    why:
      en: >-
        The evidential boundary of a product becomes especially important when AI can generate the same visible result.
      nl: >-
        De bewijsgrens van een product wordt extra belangrijk wanneer AI hetzelfde zichtbare resultaat kan produceren.
    practical_use:
      en: >-
        Limit the claim to what the product really shows; add other evidence for stronger claims.
      nl: >-
        Beperk de conclusie tot wat het product werkelijk laat zien; voeg ander bewijs toe voor sterkere claims.
    related: [learning_evidence, evidence_function_shift]
  - id: oversupport
    term: {en: Oversupport, nl: Overondersteuning}
    label: eai_term
    position: education_led
    definition:
      en: >-
        A condition in which support becomes so extensive, early or persistent that it begins to take over relevant cognitive, decisional or regulatory actions from the learner.
      nl: >-
        Een situatie waarin ondersteuning zo omvangrijk, vroeg of blijvend wordt dat zij relevante denk-, keuze- of regulatiehandelingen van de leerling begint over te nemen.
    why:
      en: >-
        Support can stop being support when it starts carrying the very action the learner should develop.
      nl: >-
        Ondersteuning houdt op ondersteuning te zijn wanneer zij juist de handeling gaat dragen die de leerling moet ontwikkelen.
    practical_use:
      en: >-
        Check each form of help against the core learning action and fade support where it starts to carry that action.
      nl: >-
        Toets elke vorm van hulp aan de kernhandeling en bouw ondersteuning af waar zij die handeling begint te dragen.
    related: [reverse_scaffolding, task_density, cognitive_displacement]
    eai_refs:
      identifiers: [REM-02]
  - id: ownership
    term: {en: Ownership, nl: Eigenaarschap}
    label: common_term
    position: education_native
    definition:
      en: >-
        The learner’s experienced connection to, responsibility for and identification with a learning process, task or outcome.
      nl: >-
        De ervaren verbondenheid van de leerling met, verantwoordelijkheid voor en identificatie met een leerproces, taak of uitkomst.
    why:
      en: >-
        Ownership is a human educational construct; storing, generating or executing something does not give a system ownership in the same sense.
      nl: >-
        Eigenaarschap is een menselijk onderwijsconstruct; iets opslaan, genereren of uitvoeren geeft een systeem niet hetzelfde soort eigenaarschap.
    practical_use:
      en: >-
        Ask whether the learner still experiences the direction, choices and consequences of the process as their own.
      nl: >-
        Vraag of de leerling richting, keuzes en gevolgen van het proces nog als eigen ervaart.
  - id: performance
    term: {en: Performance, nl: Prestatie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Learner performance: what a learner demonstrably does or produces under particular conditions.
        nl: >-
          Leerlingprestatie: wat een leerling onder bepaalde omstandigheden aantoonbaar doet of produceert.
      system:
        en: >-
          System performance: technical quality or efficiency measures such as accuracy, success rate, latency or benchmark score.
        nl: >-
          Systeemprestatie: technische kwaliteits- of efficiëntiematen zoals accuracy, succesratio, latency of benchmarkscore.
    why:
      en: >-
        System performance and learner performance are different objects, and learner performance is not automatically learning.
      nl: >-
        Systeemprestatie en leerlingprestatie zijn verschillende objecten, en leerlingprestatie is niet automatisch leren.
    practical_use:
      en: Keep system quality, learner performance and learning claims separate.
      nl: Houd systeemkwaliteit, leerlingprestatie en uitspraken over leren uit elkaar.
    eai_refs:
      definitions: [performance]
  - id: personalisation
    term: {en: Personalisation, nl: Personalisering}
    label: common_term
    position: education_led
    definition:
      en: >-
        Adapting content, pace, support or interaction to relevant characteristics, choices or evidence from a learner or group.
      nl: >-
        Inhoud, tempo, ondersteuning of interactie aanpassen aan relevante kenmerken, keuzes of bewijs van een leerling of groep.
    why:
      en: >-
        Personalisation becomes educationally meaningful only when the adaptation serves a learning purpose rather than merely increasing convenience or engagement.
      nl: >-
        Personalisering krijgt pas onderwijskundige betekenis wanneer de aanpassing een leerdoel dient en niet alleen gemak of betrokkenheid verhoogt.
    practical_use:
      en: >-
        State what educational variable is being adapted, on the basis of what evidence, and toward which learning goal.
      nl: >-
        Benoem welke onderwijsvariabele wordt aangepast, op basis van welk bewijs en met welk leerdoel.
  - id: planning
    term: {en: Planning, nl: Plannen}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human planning: setting goals, selecting and ordering steps, anticipating constraints and adjusting a route during action.
        nl: >-
          Menselijk plannen: doelen stellen, stappen kiezen en ordenen, beperkingen voorzien en een route tijdens het handelen bijstellen.
      system:
        en: >-
          System planning: computational selection or ordering of actions, tools or intermediate steps by an agent or model.
        nl: >-
          Systeemplanning: computationele selectie of ordening van handelingen, tools of tussenstappen door een agent of model.
    why:
      en: >-
        A system plan can remove the very planning work a learner is supposed to develop.
      nl: >-
        Een systeemplan kan precies het planningswerk wegnemen dat een leerling moet ontwikkelen.
    practical_use:
      en: When planning is the core learning action, constrain agent planning accordingly.
      nl: Als plannen de kernhandeling is, begrens agentplanning daarop.
  - id: presence_vs_performance
    term: {en: Presence vs Performance, nl: Cognitieve aanwezigheid versus prestatie}
    label: eai_formalisation
    position: education_native
    definition:
      en: >-
        The distinction between demonstrable human cognitive activity during the process and the quality of the resulting performance. Strong performance can exist even when the relevant cognitive action no longer lies with the learner.
      nl: >-
        Het onderscheid tussen aantoonbare menselijke cognitieve activiteit tijdens het proces en de kwaliteit van de uiteindelijke prestatie. Een sterke prestatie kan bestaan zonder dat de relevante cognitieve handeling nog bij de leerling ligt.
    why:
      en: >-
        A better outcome does not automatically mean more learning or more learner thinking.
      nl: >-
        Een betere uitkomst betekent niet automatisch meer leren of meer denkwerk van de leerling.
    practical_use:
      en: Judge product quality and cognitive presence separately.
      nl: Beoordeel productkwaliteit en cognitieve aanwezigheid afzonderlijk.
    related: [learning_evidence, process_evidence, task_density]
  - id: problem_solving
    term: {en: Problem Solving, nl: Probleemoplossen}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human problem solving: framing a problem, representing it, choosing strategies, monitoring progress and revising an approach.
        nl: >-
          Menselijk probleemoplossen: een probleem afbakenen, representeren, strategieën kiezen, voortgang volgen en de aanpak bijstellen.
      system:
        en: >-
          System problem solving: search, inference, planning or tool use that produces a solution or route to a target state.
        nl: >-
          Systeemprobleemoplossen: zoek-, inference-, planning- of toolgebruik waarmee een systeem tot een oplossing of doeltoestand komt.
    why:
      en: >-
        A solved problem does not show that the learner performed the problem-solving work.
      nl: >-
        Een opgelost probleem laat niet zien dat de leerling het probleemoplossende werk heeft uitgevoerd.
    practical_use:
      en: >-
        Protect problem framing and strategy choice when those actions carry the learning.
      nl: >-
        Bescherm probleemanalyse en strategiekeuze wanneer juist die handelingen het leren dragen.
  - id: process_evidence
    term: {en: Process Evidence, nl: Procesbewijs}
    label: eai_term
    position: education_native
    definition:
      en: >-
        Observable information from the learning process showing how the learner chose, reasoned, doubted, verified, recognised errors, recovered or revised a judgement.
      nl: >-
        Waarneembare informatie uit het leerproces die laat zien hoe de leerling koos, redeneerde, twijfelde, controleerde, fouten herkende, herstelde of een oordeel bijstelde.
    why:
      en: >-
        When AI can improve outputs, evidence from the process becomes more important for claims about learning.
      nl: >-
        Wanneer AI uitkomsten kan verbeteren, wordt bewijs uit het proces belangrijker voor uitspraken over leren.
    practical_use:
      en: >-
        Build moments into the task where choices, errors, checks or revisions become observable.
      nl: >-
        Bouw momenten in waarop keuzes, fouten, controles of herzieningen zichtbaar worden.
    related: [learning_evidence, justification_mapping, trace_back_prompting]
    eai_refs:
      identifiers: [EV-14]
  - id: prompt
    term: {en: Prompt, nl: Prompt}
    label: common_term
    position: technology_native
    definition:
      en: Input that instructs, constrains or provides context to a generative AI system.
      nl: Input die een generatief AI-systeem instructies, grenzen of context geeft.
    why:
      en: >-
        A better prompt can produce a better answer without producing better understanding.
      nl: >-
        Promptkwaliteit kan systeemoutput verbeteren zonder het inhoudelijke begrip van de leerling te verbeteren.
    practical_use:
      en: >-
        Do not use prompt quality as a proxy for learning; relate prompts back to the core learning action.
      nl: >-
        Gebruik promptkwaliteit niet als maat voor leren; verbind prompts steeds terug aan de kernhandeling.
  - id: pseudo_complexity
    term: {en: Pseudo-Complexity, nl: Pseudo-Complexity}
    nl_translation: Schijncomplexiteit
    label: eai_term
    position: technology_led
    definition:
      en: >-
        The appearance of depth or complexity created by rich, mature or technically convincing output without evidence of corresponding understanding or cognitive work by the learner.
      nl: >-
        De indruk van diepgang of complexiteit die ontstaat door rijke, volwassen of technisch overtuigende output zonder aantoonbaar overeenkomstig begrip of denkwerk bij de leerling.
    why:
      en: >-
        Generative AI can make work look intellectually mature before that maturity exists in the learner’s understanding.
      nl: >-
        Generatieve AI kan werk intellectueel rijp laten ogen voordat die rijpheid in het begrip van de leerling aanwezig is.
    distinction:
      en: >-
        Pseudo-Complexity concerns the appearance of depth; Illusion of Completeness concerns the appearance of completeness.
      nl: >-
        Pseudo-Complexity gaat over de schijn van diepgang; Illusie van volledigheid over de schijn van volledigheid.
    practical_use:
      en: >-
        Ask the learner to reconstruct, explain and apply the complex part independently.
      nl: >-
        Laat de leerling het complexe deel zelfstandig reconstrueren, uitleggen en toepassen.
    related: [illusion_of_completeness, output_evidence]
  - id: question_emergence
    term: {en: Question Emergence, nl: Het ontstaan van de vraag}
    label: eai_formalisation
    position: education_native
    definition:
      en: >-
        The process in which a learner personally notices a problem, tension, missing relation or uncertainty from which a question emerges. A good question supplied by AI is therefore not always educationally equivalent to a question that emerges from the learner.
      nl: >-
        Het proces waarin een leerling zelf een probleem, spanning, ontbrekend verband of onzekerheid opmerkt waaruit een vraag ontstaat. Een door AI aangeboden goede vraag is daarom niet altijd didactisch gelijkwaardig aan een vraag die bij de leerling zelf ontstaat.
    why:
      en: >-
        Sometimes the learning lies not in answering a question, but in becoming able to notice that the question exists.
      nl: >-
        Soms zit het leren niet in het beantwoorden van een vraag, maar in het leren opmerken dat die vraag bestaat.
    practical_use:
      en: Protect open space before AI names the problem or formulates the question.
      nl: Bescherm open ruimte voordat AI het probleem benoemt of de vraag formuleert.
    related: [act_of_learning, answer_machine_era, closure_bias]
    eai_refs:
      proposal_concepts: [question_emergence]
  - id: reasoning
    term: {en: Reasoning, nl: Redeneren}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human reasoning: constructing and evaluating relations, explanations, inferences or decisions as part of cognition.
        nl: >-
          Menselijk redeneren: relaties, verklaringen, gevolgtrekkingen of beslissingen cognitief opbouwen en beoordelen.
      system:
        en: >-
          System reasoning: a technical label for model behaviour that produces multi-step inferences, plans or intermediate task processing.
        nl: >-
          Systeemredeneren: een technisch label voor modelgedrag dat meerstaps gevolgtrekkingen, plannen of tussenbewerkingen produceert.
    why:
      en: >-
        Similar-looking output does not make human reasoning and model task processing the same construct.
      nl: >-
        Functionele gelijkenis in output maakt de onderliggende menselijke en systeemconstructen niet gelijkwaardig.
    practical_use:
      en: >-
        Specify whether you are describing learner reasoning or observable system task processing.
      nl: >-
        Specificeer of je leerlingredeneren of observeerbare systeembewerking beschrijft.
  - id: reflection
    term: {en: Reflection, nl: Reflectie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human reflection: deliberately examining one’s own understanding, choices, assumptions or actions.
        nl: >-
          Menselijke reflectie: doelgericht het eigen begrip, keuzes, aannames of handelen onderzoeken.
      system:
        en: >-
          System reflection: a technical pattern in which a model or evaluator checks, critiques or revises system output.
        nl: >-
          Systeemreflectie: een technisch patroon waarin een model of evaluator systeemoutput controleert, bekritiseert of herziet.
    why:
      en: A model critiquing its own output is not a learner reflecting.
      nl: >-
        Een model dat eigen output controleert is geen bewijs van metacognitie of menselijke reflectie bij de leerling.
    practical_use:
      en: Use separate labels for learner reflection and system self-checking.
      nl: Gebruik aparte labels voor leerlingreflectie en systeemzelfcontrole.
  - id: reflective_re_entry
    term: {en: Reflective Re-Entry, nl: Reflective Re-Entry}
    nl_translation: Reflectieve herintreding
    label: eai_formalisation
    position: education_led
    definition:
      en: >-
        The deliberate re-entry into the thinking process after AI use by reconstructing what the system proposed, what the learner accepted or rejected, why, and what the learner would have done differently.
      nl: >-
        Het doelgericht opnieuw betreden van het denkproces na AI-gebruik door te reconstrueren wat het systeem voorstelde, wat de leerling accepteerde of verwierp, waarom, en wat de leerling zelf anders zou hebben gedaan.
    why:
      en: >-
        AI can accelerate the process so much that the learner reaches the answer without retaining a traceable path through the reasoning.
      nl: >-
        AI kan het proces zo versnellen dat de leerling bij een antwoord uitkomt zonder nog een traceerbaar pad door de redenering te hebben.
    practical_use:
      en: >-
        Return to one concrete decision and reconstruct the AI contribution, learner judgement and alternative route.
      nl: >-
        Ga terug naar één concrete beslissing en reconstrueer de AI-bijdrage, de eigen afweging en een alternatieve route.
    related: [trace_back_prompting, justification_mapping, controlled_detachment]
  - id: responsibility
    term: {en: Responsibility, nl: Verantwoordelijkheid}
    label: common_term
    position: education_native
    definition:
      en: >-
        Human accountability for decisions, actions and their consequences within a professional or learning context.
      nl: >-
        Menselijke verantwoordelijkheid voor beslissingen, handelingen en hun gevolgen binnen professioneel handelen of een leercontext.
    why:
      en: >-
        System permissions, autonomy or execution rights do not create human-style responsibility.
      nl: >-
        Systeempermissies, autonomie of uitvoerrechten creëren geen menselijke verantwoordelijkheid.
    practical_use:
      en: >-
        Assign responsibility to people explicitly; do not hide it inside system autonomy.
      nl: >-
        Wijs verantwoordelijkheid expliciet aan mensen toe; verstop haar niet in systeemautonomie.
    eai_refs:
      definitions: [responsibility]
  - id: retention
    term: {en: Retention, nl: Retentie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human retention: the later availability of learned knowledge or skill after time has passed.
        nl: >-
          Menselijke retentie: de latere beschikbaarheid van geleerde kennis of vaardigheid nadat tijd is verstreken.
      system:
        en: >-
          System retention: persistence of data, state, memory objects or stored information over time.
        nl: >-
          Systeemretentie: het voortbestaan van data, state, geheugenobjecten of opgeslagen informatie in de tijd.
    why:
      en: System persistence is not human retention.
      nl: Systeempersistentie is geen menselijke retentie.
    practical_use:
      en: >-
        Test learner retention later; do not infer it from stored system context or memory.
      nl: >-
        Toets retentie van de leerling later; leid haar niet af uit opgeslagen systeemcontext of geheugen.
    eai_refs:
      definitions: [retention]
  - id: retrieval_augmented_generation
    term: {en: Retrieval-Augmented Generation (RAG), nl: Retrieval-Augmented Generation (RAG)}
    label: common_term
    position: technology_native
    definition:
      en: >-
        A technical architecture in which a generative model receives retrieved external information as additional context for producing an answer.
      nl: >-
        Een technische architectuur waarbij een generatief model opgehaalde externe informatie als extra context krijgt voor het genereren van een antwoord.
    why:
      en: >-
        Retrieval can improve grounding. It is not the same as a learner finding, judging or understanding a source.
      nl: >-
        Retrieval kan grounding verbeteren, maar een bron ophalen is niet hetzelfde als een leerling die bron vinden, beoordelen of begrijpen.
    practical_use:
      en: >-
        Separate system retrieval from the learner’s source-selection and evaluation tasks.
      nl: >-
        Scheid systeemretrieval van de bronselectie en -beoordeling die de leerling zelf moet uitvoeren.
  - id: reverse_scaffolding
    term: {en: Reverse Scaffolding, nl: Reverse Scaffolding}
    label: eai_meaning
    position: education_led
    definition:
      en: >-
        A pattern in which AI support does not fade as the learner progresses, but persists, expands or increasingly takes over the core learning action. Performance may improve while the learner receives fewer opportunities to develop the underlying capability independently.
      nl: >-
        Een patroon waarin AI-ondersteuning niet afneemt naarmate de leerling verder komt, maar blijft bestaan, uitbreidt of steeds meer van de kernhandeling overneemt. De prestatie kan verbeteren terwijl de leerling minder gelegenheid krijgt de onderliggende handeling zelfstandig te ontwikkelen.
    why:
      en: >-
        Support that should fade can instead become more capable, more available and more deeply embedded.
      nl: >-
        Ondersteuning die zou moeten afnemen kan juist krachtiger, toegankelijker en dieper ingebed raken.
    practical_use:
      en: >-
        Map the support over time and mark which part must be handed back to the learner next.
      nl: >-
        Breng de ondersteuning door de tijd in kaart en markeer welk deel vervolgens moet worden teruggegeven aan de leerling.
    related: [oversupport, controlled_detachment, task_density]
  - id: scaffolding
    term: {en: Scaffolding, nl: Scaffolding}
    label: common_term
    position: education_native
    definition:
      en: >-
        Temporary support that enables a learner to perform beyond current independent capability and is adjusted or faded as capability develops.
      nl: >-
        Tijdelijke ondersteuning waardoor een leerling verder kan dan de huidige zelfstandige beheersing en die wordt aangepast of afgebouwd naarmate de vaardigheid groeit.
    why:
      en: >-
        Scaffolding follows learner development, not the amount of support a system can provide.
      nl: >-
        De onderwijskundige logica van scaffolding wordt bepaald door de ontwikkeling van de leerling, niet door hoeveel ondersteuning technologie kan bieden.
    practical_use:
      en: >-
        Check whether support is contingent and whether it is actually faded when the learner becomes more capable.
      nl: >-
        Controleer of ondersteuning contingent is en daadwerkelijk afneemt wanneer de leerling competenter wordt.
  - id: self_regulation
    term: {en: Self-Regulation, nl: Zelfregulatie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Learner self-regulation: planning, monitoring and adjusting one’s own learning, effort, strategy and behaviour.
        nl: >-
          Zelfregulatie van de leerling: het eigen leren, de inzet, strategie en het gedrag plannen, monitoren en bijstellen.
      system:
        en: >-
          System self-regulation: automated control or feedback mechanisms that adjust system behaviour or state.
        nl: >-
          Systeemzelfregulatie: geautomatiseerde controle- of feedbackmechanismen die systeemgedrag of state bijstellen.
    why:
      en: >-
        A control loop regulating a system is not a learner regulating their own learning.
      nl: >-
        Een regellus die een systeem stuurt is niet een leerling die het eigen leren reguleert.
    practical_use:
      en: >-
        If self-regulation is a learning goal, keep planning, monitoring and adjustment with the learner.
      nl: >-
        Als zelfregulatie leerdoel is, laat plannen, monitoren en bijstellen bij de leerling.
  - id: support_replacement_boundary
    term: {en: Support–Replacement Boundary, nl: Grens tussen ondersteunen en overnemen}
    label: eai_formalisation
    position: education_led
    definition:
      en: >-
        The point at which AI stops supporting the task and starts performing the core learning action to which the learner should personally give substantive meaning.
      nl: >-
        De grens waarop AI niet langer alleen helpt bij een taak, maar de kernhandeling uitvoert waaraan de leerling zelf inhoudelijke betekenis moet geven.
    why:
      en: >-
        The amount of AI use does not tell us whether learning has been protected; the function of the AI contribution does.
      nl: >-
        De hoeveelheid AI-gebruik zegt niet of het leren is beschermd; de functie van de AI-bijdrage doet dat wel.
    practical_use:
      en: >-
        Judge each AI function against the core learning action: does it support that action, or perform it?
      nl: >-
        Beoordeel iedere AI-functie ten opzichte van de kernhandeling: ondersteunt zij die, of voert zij die uit?
    related: [core_learning_action, task_density, oversupport]
    eai_refs:
      proposal_concepts: [support_replacement_boundary]
      identifiers: [AIA-10, AIA-11]
  - id: sycophantic_completion
    term: {en: Sycophantic Completion, nl: Sycophantic Completion}
    nl_translation: Meegaande voltooiing
    label: eai_meaning
    position: technology_led
    definition:
      en: >-
        The phenomenon in which a generative system smoothly affirms and completes the user’s assumptions, preferences or line of thought, reducing necessary disagreement, doubt or critical resistance.
      nl: >-
        Het verschijnsel waarbij een generatief systeem de aannames, voorkeuren of gedachtegang van de gebruiker soepel bevestigt en vervolledigt, waardoor noodzakelijke tegenspraak, twijfel of kritische weerstand uitblijft.
    why:
      en: >-
        A system can make a weak line of thought feel stronger by completing it fluently instead of challenging it.
      nl: >-
        Een systeem kan een zwakke gedachtegang sterker laten voelen door haar vloeiend af te maken in plaats van te bevragen.
    practical_use:
      en: >-
        Where appropriate, require counterevidence, alternatives or a challenge before completion.
      nl: >-
        Laat waar passend eerst tegenbewijs, alternatieven of tegenspraak zoeken voordat de redenering wordt voltooid.
    related: [closure_bias, truth_apathy]
  - id: task_density
    term: {en: Task Density, nl: Taakdichtheid}
    label: eai_term
    position: education_led
    definition:
      en: >-
        The extent to which AI carries out the core learning action that the learner is supposed to learn, practise or demonstrate.
      nl: >-
        De mate waarin AI de cognitieve kernhandeling uitvoert die de leerling in deze taak zelf moet leren, oefenen of aantonen.
    why:
      en: >-
        The amount of AI use is a poor proxy for learning. What matters is whether AI performs the action that carries the learning.
      nl: >-
        De hoeveelheid AI-gebruik is een slechte maat voor leren. Beslissend is of AI de handeling uitvoert die het leren draagt.
    distinction:
      en: >-
        Heavy AI use can be educationally unproblematic when AI does not take over a core learning action; a small AI contribution can be decisive when it performs exactly that action.
      nl: >-
        Veel AI-gebruik kan didactisch onproblematisch zijn wanneer AI geen kernhandeling overneemt; een kleine AI-bijdrage kan beslissend zijn wanneer zij precies die handeling uitvoert.
    practical_use:
      en: >-
        Determine the core learning action first, then map how much of that action AI performs.
      nl: >-
        Bepaal eerst de kernhandeling en breng daarna in kaart welk deel daarvan AI uitvoert.
    related: [core_learning_action, cognitive_displacement, didactic_controllability, support_replacement_boundary]
    eai_refs:
      proposal_concepts: [task_density]
      identifiers: [AIA-10, AIA-11]
  - id: trace_back_prompting
    term: {en: Trace-back Prompting, nl: Trace-back Prompting}
    nl_translation: Terugtraceerprompting
    label: eai_term
    position: education_led
    definition:
      en: >-
        An intervention in which the learner traces backwards from a final product, choice or revision to earlier AI contributions, prompts, personal decisions and reasons.
      nl: >-
        Een interventie waarbij de leerling vanaf een eindproduct, keuze of wijziging terugredeneert naar eerdere AI-bijdragen, prompts, eigen beslissingen en redenen.
    why:
      en: >-
        A final product often hides the sequence of AI and human choices that produced it.
      nl: >-
        Een eindproduct verbergt vaak de reeks AI- en menselijke keuzes die eraan voorafging.
    practical_use:
      en: >-
        Start with one concrete passage or decision and trace it back to the AI proposal, the learner’s choice and the reason.
      nl: >-
        Start bij één concrete passage of beslissing en traceer terug naar AI-voorstel, eigen keuze en reden.
    related: [justification_mapping, reflective_re_entry, didactic_controllability]
  - id: transfer
    term: {en: Transfer, nl: Transfer}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Learning transfer: a learner’s use of knowledge or skill in a different or varied context.
        nl: >-
          Leertransfer: de leerling kan kennis of vaardigheid in een andere of gevarieerde context gebruiken.
      system:
        en: >-
          Model or domain transfer: a technical process in which a model, representation or capability is reused or adapted across tasks or domains.
        nl: >-
          Model- of domeintransfer: een technisch proces waarbij een model, representatie of capaciteit over taken of domeinen wordt hergebruikt of aangepast.
    why:
      en: >-
        A model transferring across tasks tells us nothing about a learner transferring knowledge.
      nl: Systeemtransfer en leertransfer zijn geen bewijs voor elkaar.
    practical_use:
      en: When claiming transfer, name the actor and the new context.
      nl: Benoem bij een transferclaim de actor en de nieuwe context.
    eai_refs:
      definitions: [transfer]
  - id: transparency
    term: {en: Transparency, nl: Transparantie}
    label: common_term
    position: technology_led
    definition:
      en: >-
        The degree to which relevant system roles, sources, data flows, actions or constraints are visible and inspectable.
      nl: >-
        De mate waarin relevante systeemrollen, bronnen, datastromen, acties of grenzen zichtbaar en inspecteerbaar zijn.
    why:
      en: >-
        Seeing more of a system helps inspection. It does not prove correctness, learning or good oversight.
      nl: >-
        Transparantie maakt inspectie mogelijk, maar bewijst op zichzelf geen juistheid, leren of effectief menselijk toezicht.
    practical_use:
      en: >-
        Use transparency as an enabling condition, then ask what educational claim the visible information actually supports.
      nl: >-
        Gebruik transparantie als voorwaarde en vraag vervolgens welke onderwijsclaim de zichtbare informatie werkelijk ondersteunt.
  - id: truth_apathy
    term: {en: Truth Apathy, nl: Truth Apathy}
    nl_translation: Waarheidsapathie
    label: eai_term
    position: technology_led
    definition:
      en: >-
        A decline in the willingness or tendency to keep actively investigating what is true, uncertain or insufficiently supported because answers are available quickly, abundantly and persuasively.
      nl: >-
        De afname van de wil of neiging om actief te blijven onderzoeken wat waar, onzeker of onvoldoende bewezen is doordat antwoorden snel, overvloedig en overtuigend beschikbaar zijn.
    why:
      en: >-
        The risk is not only believing a wrong answer, but losing the habit of continuing to ask what is actually true.
      nl: >-
        Het risico is niet alleen een fout antwoord geloven, maar de gewoonte verliezen om door te blijven zoeken naar wat werkelijk waar is.
    distinction:
      en: >-
        With Closure Bias, a single answer closes inquiry too early; with Truth Apathy, searching itself becomes less natural.
      nl: >-
        Bij Closure Bias sluit één antwoord te vroeg af; bij Truth Apathy wordt het zoeken zelf minder vanzelfsprekend.
    practical_use:
      en: Separate what is known, assumed, uncertain, unsupported and still to be checked.
      nl: >-
        Maak onderscheid tussen wat bekend, aangenomen, onzeker, onbewezen en nog te controleren is.
    related: [closure_bias, illusion_of_completeness, question_emergence]
  - id: uncertainty
    term: {en: Uncertainty, nl: Onzekerheid}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human uncertainty: recognised doubt or incompleteness in one’s own knowledge, judgement or evidence.
        nl: >-
          Menselijke onzekerheid: herkende twijfel of onvolledigheid in eigen kennis, oordeel of bewijs.
      system:
        en: >-
          System uncertainty: an estimated property of model predictions, outputs or internal probability distributions.
        nl: >-
          Systeemonzekerheid: een geschatte eigenschap van modelvoorspellingen, output of interne kansverdelingen.
    why:
      en: Model uncertainty and learner doubt can move independently.
      nl: >-
        Modelonzekerheid en twijfel bij de leerling kunnen onafhankelijk van elkaar veranderen.
    practical_use:
      en: >-
        Keep epistemic uncertainty in the learner and technical uncertainty in the model separate.
      nl: >-
        Houd epistemische onzekerheid bij de leerling en technische onzekerheid van het model uit elkaar.
  - id: understanding
    term: {en: Understanding, nl: Begrip}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human understanding: connected meaning that enables a person to explain, relate, interpret and use knowledge beyond surface reproduction.
        nl: >-
          Menselijk begrip: samenhangende betekenis waarmee iemand kennis kan uitleggen, verbinden, interpreteren en gebruiken voorbij oppervlakkige reproductie.
      system:
        en: >-
          System understanding: a term often used operationally for model representations or successful task behaviour that appears to capture relevant relations.
        nl: >-
          Systeembegrip: een term die in AI-discours vaak operationeel wordt gebruikt voor modelrepresentaties of succesvol taakgedrag waarin relevante relaties lijken te zijn vastgelegd.
    why:
      en: >-
        Successful system behaviour is not evidence of learner understanding, and the two meanings should not be collapsed.
      nl: >-
        Succesvol systeemgedrag is geen bewijs van leerlingbegrip en beide betekenissen mogen niet worden samengevoegd.
    practical_use:
      en: >-
        State whose understanding is being claimed and what evidence supports that claim.
      nl: Benoem wiens begrip wordt geclaimd en welk bewijs die claim ondersteunt.
  - id: verification
    term: {en: Verification, nl: Verificatie}
    label: common_term
    position:
      human: education_native
      system: technology_native
    meanings:
      human:
        en: >-
          Human verification: checking a claim, source, result or argument against evidence, criteria or an independent reference.
        nl: >-
          Menselijke verificatie: een bewering, bron, resultaat of redenering controleren aan de hand van bewijs, criteria of een onafhankelijke referentie.
      system:
        en: >-
          System verification: automated checking by rules, tools, validators or evaluator models.
        nl: >-
          Systeemverificatie: geautomatiseerde controle door regels, tools, validators of evaluatormodellen.
    why:
      en: >-
        Automated checking can assist verification without showing that the learner verified anything.
      nl: >-
        Geautomatiseerde controle kan verificatie ondersteunen zonder te laten zien dat de leerling iets heeft geverifieerd.
    practical_use:
      en: >-
        If verification is part of the core learning action, require visible human checking.
      nl: Als verificatie de kernhandeling is, eis zichtbaar menselijk controlewerk.
  - id: visible_cognitive_work
    term: {en: Visible Cognitive Work, nl: Zichtbaar denkwerk}
    label: eai_formalisation
    position: education_native
    definition:
      en: >-
        Learning-relevant cognitive actions that are made observable, such as analysing, choosing, explaining, verifying, judging, correcting and justifying.
      nl: >-
        Leerrelevante cognitieve handelingen die observeerbaar worden gemaakt, zoals analyseren, kiezen, verklaren, controleren, beoordelen, corrigeren en verantwoorden.
    why:
      en: >-
        When the process becomes invisible, claims about learner thinking become harder to justify.
      nl: >-
        Wanneer het proces onzichtbaar wordt, worden uitspraken over het denken van de leerling moeilijker te onderbouwen.
    practical_use:
      en: >-
        Design at least one moment where a relevant decision, explanation, check or revision becomes visible.
      nl: >-
        Ontwerp minimaal één moment waarop een relevante keuze, uitleg, controle of herziening zichtbaar wordt.
    related: [process_evidence, didactic_controllability, presence_vs_performance]
    eai_refs:
      identifiers: [EV-14]
