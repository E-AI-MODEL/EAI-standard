# Dutch sector terms and how they relate to EAI constructs.
# Non-normative. Implements rule 6 of "Language versions" in GOVERNANCE.md:
# a sector term used as an entry point for a canonical construct is recorded
# explicitly, together with any difference in scope.

standard_version: 0.5.0-candidate
status: non_normative
scope_values:
  equivalent: The sector term and the referenced construct mean the same thing.
  broader: The sector term covers more than the referenced construct.
  narrower: The sector term covers only part of the referenced construct.
  related: The sector term touches the referenced construct but is not a translation of it.
  context_only: The sector term names a legal or institutional basis. It belongs in a context overlay and has no canonical EAI equivalent.

terms:
  - id: menselijke_regie
    term_nl: menselijke regie
    gloss_en: human direction and control
    scope: broader
    refs:
      files: [schemas/human-control.schema.json]
      definitions: [responsibility]
      dictionary: [authority, decision_making, responsibility]
    note:
      nl: >-
        In het veld omvat menselijke regie wie richting geeft, beslist en kan ingrijpen, ook bij ontwerpkeuzes voordat AI wordt ingezet. In EAI legt `human_control` dat per casus vast: verantwoordelijke actor, beslisbevoegdheid, beschikbare informatie, moment en mogelijkheden om in te grijpen. Gebruik menselijke regie als Nederlandse ingang, niet als synoniem.
      en: >-
        In sector usage, menselijke regie covers who sets direction, decides and can intervene, including design choices made before AI is used. EAI records this per case in `human_control`: responsible actor, decision authority, available information, timing and intervention capabilities. Use the term as a Dutch entry point, not as a synonym.

  - id: menselijk_toezicht
    term_nl: menselijk toezicht
    gloss_en: human oversight (EU AI Act)
    scope: context_only
    refs:
      files: [context/eu-regulatory-protection.yaml, schemas/human-control.schema.json]
    note:
      nl: >-
        Juridisch begrip uit de AI-verordening (artikel 14) voor AI-systemen met een hoog risico. Of het van toepassing is, volgt uit de contextlaag, niet uit EAI zelf. Menselijk toezicht is niet hetzelfde als menselijke uitvoering: AI kan handelingen uitvoeren terwijl effectief toezicht wettelijk vereist blijft.
      en: >-
        Legal term from the EU AI Act (Article 14) for high-risk AI systems. Whether it applies follows from the context overlay, not from EAI itself. Human oversight is not the same as human execution: AI may perform operations while effective oversight remains legally required.

  - id: professioneel_oordeel
    term_nl: professioneel oordeel
    gloss_en: professional judgement
    scope: equivalent
    refs:
      claim_types: [professional_judgement]
      dictionary: [judgement]
    note:
      nl: >-
        Een verantwoord oordeel van een professional op basis van relevante informatie. Omvat pedagogisch, diagnostisch en beoordelend oordeel.
      en: >-
        An accountable judgement by a professional based on relevant information. Covers pedagogical, diagnostic and assessment judgement.

  - id: pedagogisch_oordeel
    term_nl: pedagogisch oordeel
    gloss_en: pedagogical judgement
    scope: narrower
    refs:
      claim_types: [professional_judgement]
      files: [registries/microstructures/teacher-pedagogical-judgement.yaml]
    note:
      nl: >-
        Eén vorm van professioneel oordeel: afwegen wat pedagogisch en relationeel passend is voor deze leerling. Diagnostisch oordeel (registries/microstructures/teacher-diagnostic-judgement.yaml) is een andere vorm. Vertaal `professional_judgement` daarom niet als pedagogisch oordeel.
      en: >-
        One kind of professional judgement: weighing what is pedagogically and relationally appropriate for this learner. Diagnostic judgement (registries/microstructures/teacher-diagnostic-judgement.yaml) is another kind. Do not translate `professional_judgement` as pedagogisch oordeel.

  - id: kernhandeling
    term_nl: kernhandeling
    gloss_en: core learning action
    scope: equivalent
    refs:
      definitions: [core_learning_action]
      dictionary: [core_learning_action]
    note:
      nl: >-
        Gelijk aan het EAI-begrip core learning action uit de 0.5-standaard: de stap waaraan de leerling in deze fase zelf inhoudelijke betekenis moet geven. Dat is een leerlingspecifieke invulling van het bredere `core_human_action`. Voor handelingen van docenten en andere professionals geldt `core_human_action`.
      en: >-
        Equivalent to the EAI core learning action in the 0.5 standard: the step to which the learner must personally give substantive meaning at this stage. It is a learner-specific specialisation of the broader `core_human_action`; actions of teachers and other professionals use `core_human_action`.

  - id: zelfstandige_beheersing
    term_nl: zelfstandige beheersing
    gloss_en: independent mastery
    scope: equivalent
    refs:
      claim_types: [independent_mastery]
      definitions: [independent_mastery]
      dictionary: [independent_evidence, mastery]
    note:
      nl: >-
        De leerling kan de relevante handeling uitvoeren met ondersteuning die is teruggebracht tot het niveau dat de claim vraagt. Een met AI ondersteund product is daarvoor op zichzelf geen bewijs.
      en: >-
        The learner can perform the relevant action with support reduced to the level the claim requires. An AI-supported product is not, by itself, evidence of it.

  - id: bewijs_van_leren
    term_nl: bewijs van leren
    gloss_en: learning evidence
    scope: narrower
    refs:
      definitions: [human_evidence, evidence_claim]
      dictionary: [learning_evidence]
    note:
      nl: >-
        Gelijk aan Learning Evidence in de dictionary. Smaller dan het canonieke `human_evidence`, dat ook bewijs voor professioneel oordeel omvat.
      en: >-
        Equivalent to Learning Evidence in the dictionary. Narrower than the canonical `human_evidence`, which also covers evidence for professional judgement.

  - id: ondersteunen_versus_overnemen
    term_nl: ondersteunen versus overnemen
    gloss_en: support versus replacement
    scope: related
    refs:
      definitions: [support_replacement_boundary]
      dictionary: [support_replacement_boundary]
      identifiers: [AIA-10, AIA-11]
    note:
      nl: >-
        De algemene sectorterm is verwant aan de leerlingspecifieke EAI-grens: voert AI de kernhandeling uit? `AIA-10` en `AIA-11` beschrijven gedeeltelijke en volledige uitvoering van een relevante menselijke handeling, niet automatisch die grens.
      en: >-
        The general sector term relates to the learner-specific EAI boundary: does AI perform the core learning action? `AIA-10` and `AIA-11` describe partial and full performance of a relevant human action, not automatically that boundary.

  - id: verantwoordelijkheid
    term_nl: verantwoordelijkheid
    gloss_en: responsibility
    scope: equivalent
    refs:
      definitions: [responsibility]
      files: [schemas/human-control.schema.json]
      dictionary: [responsibility]
    note:
      nl: >-
        De menselijke verplichting om te interpreteren, te beslissen, goed te keuren, te beoordelen of te handelen waar de situatie een verantwoordelijk menselijk oordeel vraagt. Per casus vastgelegd als `human_control.responsible_actor`.
      en: >-
        The human obligation to interpret, decide, approve, judge or act where the situation requires accountable human judgement. Recorded per case as `human_control.responsible_actor`.

  - id: eigenaarschap
    term_nl: eigenaarschap
    gloss_en: ownership
    scope: related
    refs:
      dictionary: [ownership]
    note:
      nl: >-
        Veelgebruikt in het veld, maar zonder canoniek EAI-equivalent. Gebruik het als toelichting, niet als conformiteitsclaim.
      en: >-
        Widely used in the sector, but without a canonical EAI equivalent. Use it as explanation, not as a conformance claim.

  - id: zorgplicht
    term_nl: zorgplicht
    gloss_en: duty of care
    scope: context_only
    refs:
      files: [schemas/protection-assessment.schema.json, context/README.md]
    note:
      nl: >-
        Juridische of institutionele grondslag. Hoort in een contextlaag als grondslag van een protection assessment, nooit als EAI-regel of als wetenschappelijke claim. EAI houdt wettelijke, wetenschappelijke en institutionele grondslagen bewust gescheiden.
      en: >-
        A legal or institutional basis. It belongs in a context overlay as a basis of a protection assessment, never as an EAI rule or a scientific claim. EAI deliberately keeps legal, scientific and institutional bases apart.

  - id: ai_geletterdheid
    term_nl: AI-geletterdheid
    gloss_en: AI literacy
    scope: broader
    refs:
      files: [registries/skills/ai-interaction.yaml]
    note:
      nl: >-
        Ook de term uit artikel 4 van de AI-verordening. Breder dan het register met AI-interactievaardigheden (`AIS-*`), dat alleen menselijke vaardigheden in de omgang met AI binnen een taak beschrijft.
      en: >-
        Also the term used in Article 4 of the EU AI Act. Broader than the AI-interaction skills registry (`AIS-*`), which describes only human skills in working with AI within a task.

  - id: formatief_handelen
    term_nl: formatief handelen
    gloss_en: formative practice
    scope: related
    refs:
      files: [adapters/formatieve-toetscyclus-gulikers-baartman/adapter.yaml]
    note:
      nl: >-
        Brede veldterm. De bronbehoudende adapter voor de formatieve toetscyclus van Gulikers en Baartman bewaart de fasenamen van die bron letterlijk.
      en: >-
        Broad sector term. The source-preserving adapter for the Gulikers and Baartman formative assessment cycle keeps that source's phase names verbatim.
