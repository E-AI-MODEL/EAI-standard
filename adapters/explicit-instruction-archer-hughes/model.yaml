adapter_interpretation:
  notes:
    - The six teaching functions are used as process positions for this adapter; the EAI Standard does not generalise them to other models.
    - The sixteen instructional elements are model content, not EAI normative rules.
    - The transition from guided practice toward independent practice is especially relevant for analysing handback and support fading.
    - Monitoring, correction and reteaching create distinct teacher/professional actions that should not be collapsed into generic supervision.
