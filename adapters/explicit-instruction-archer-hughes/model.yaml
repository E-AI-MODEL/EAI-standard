version: 0.3.0-candidate
status: candidate
id: ADP-EI-ARCHER-HUGHES
model_name: Explicit Instruction
model_family: explicit_instruction
source_reference: Archer & Hughes (2011), Explicit Instruction: Effective and Efficient Teaching
source_url: https://explicitinstruction.org/download/sample-chapter.pdf

source_preservation:
  terminology_preserved: true
  ordering_preserved: true
  unmapped_elements_retained: true
  mapping_is_not_equivalence: true

source_structure:
  teaching_functions:
    - id: EI-F1
      source_label: Review
      order: 1
      source_pointer: figure_1_2_function_1
      purpose_paraphrase: Activate and verify relevant prior learning and prerequisites before new instruction.

    - id: EI-F2
      source_label: Presentation
      order: 2
      source_pointer: figure_1_2_function_2
      purpose_paraphrase: Introduce goals and new material through small steps, modelling, examples and clear language.

    - id: EI-F3
      source_label: Guided practice
      order: 3
      source_pointer: figure_1_2_function_3
      purpose_paraphrase: Elicit frequent learner responses under support, maintain high success and continue practice toward fluent performance.

    - id: EI-F4
      source_label: Corrections and feedback
      order: 4
      source_pointer: figure_1_2_function_4
      purpose_paraphrase: Correct errors, provide feedback and reteach where the evidence indicates that this is needed.

    - id: EI-F5
      source_label: Independent practice
      order: 5
      source_pointer: figure_1_2_function_5
      purpose_paraphrase: Move responsibility toward the learner while initially monitoring performance and continuing practice toward automatic or independent use where appropriate.

    - id: EI-F6
      source_label: Weekly and monthly reviews
      order: 6
      source_pointer: figure_1_2_function_6
      purpose_paraphrase: Revisit previously learned material over time to strengthen retention and continued accessibility.

