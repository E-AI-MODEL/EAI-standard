effectiveness_context_sources:
  - id: DI-EVID-01
    type: peer_reviewed_meta_analysis
    authors: [Jean Stockard, Timothy W. Wood, Cristy Coughlin, Caitlin Rasplica Khoury]
    year: 2018
    title: The Effectiveness of Direct Instruction Curricula: A Meta-Analysis of a Half Century of Research
    publication: Review of Educational Research
    doi: 10.3102/0034654317751919
    note: >-
      Older than the preferred recent-first window, but retained because it is a model-specific synthesis covering the capital-D Direct Instruction curricular tradition. It is not used as evidence for generic explicit instruction or EDI.

  - id: DI-EVID-02
    type: archived_meta_analysis_dataset
    author: Jean Stockard
    year: 2023
    title: A Meta-Analysis of 50 Years of Research on the Direct Instruction Curricular Program, 8 countries, 1966-2017
    repository: ICPSR
    doi: 10.3886/ICPSR38766.v1
    note: Provides the archived data associated with the model-specific evidence base; does not make the underlying studies recent.

boundaries:
  - NIFDI materials define the model but are not independent effectiveness evidence.
  - The 2018 meta-analysis is retained as a justified older exception because of its model specificity and scale.
  - Evidence for capital-D Direct Instruction must not be transferred to generic direct instruction, Archer-Hughes Explicit Instruction or EDI without an explicit bridge.
  - Program-specific outcomes may depend on implementation fidelity, placement and curriculum; the adapter itself is not an effectiveness claim.
