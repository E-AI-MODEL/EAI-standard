version: 0.2.0-candidate
status: candidate
adapter_id: AD-EXPLICIT-INSTRUCTION-FAMILY
adapter_type: model_family
label: explicit_instruction_family
language: en

scope:
  description: >-
    Candidate family adapter for instructional approaches that use explicit presentation, modelling,
    guided practice, checks for understanding and a deliberate movement toward independent performance.
  exclusions:
    - This is not a claim that all direct instruction, explicit instruction and EDI models are identical.
    - This adapter does not replace a source model's own terminology or implementation rules.
    - This adapter does not prescribe these process positions to users of the EAI Standard.

source_basis:
  - id: SRC-EI-ROSENSHINE-2012
    type: external_evidence_source
    title: Principles of Instruction: Research-Based Strategies That All Teachers Should Know
    author: Barak Rosenshine
    year: 2012
    source: American Educator
    url: https://www.aft.org/ae/spring2012/rosenshine
  - id: SRC-EI-EEF-EXPLICIT
    type: external_guidance_source
    title: What exactly is explicit instruction?
    organisation: Education Endowment Foundation
    url: https://educationendowmentfoundation.org.uk/news/eef-blog-what-exactly-is-explicit-instruction
  - id: SRC-EI-EEF-INDEPENDENCE
    type: external_guidance_source
    title: Modelling Independence - The Seven-step Model planning tool
    organisation: Education Endowment Foundation
    year: 2026
    url: https://educationendowmentfoundation.org.uk/news/eef-blog-modelling-independence-the-seven-step-model-planning-tool

adapter_principles:
  - New material or strategy is made explicit rather than left entirely for unguided discovery.
  - Complex content or performance is broken into manageable steps where appropriate.
  - Teacher modelling and temporary scaffolding may precede independent learner execution.
  - Understanding is checked before support is reduced or the process moves forward.
  - Guided practice is used to support successful learner execution and correction.
  - Support should not remain indefinitely when independent performance is the intended outcome.
  - Independent performance requires evidence distinct from supported performance.

process_positions:
  - id: EI-P01
    label: review_or_activate_relevant_knowledge
    purpose: Make relevant prior knowledge or previously learned performance available for the new learning episode.
    candidate_core_actions:
      teacher_professional:
        - select_relevant_prior_knowledge
        - elicit_retrieval
        - interpret_readiness_signal
      learner:
        - retrieve_prior_knowledge
        - connect_prior_knowledge_to_current_task
        - expose_knowledge_gap
    useful_ai_actions:
      - ask_question
      - generate_practice_item
      - organise_input
    displacement_risks:
      - AI supplies the prior knowledge instead of requiring learner retrieval.
      - AI interprets readiness without enough direct learner evidence.
    evidence_examples:
      - learner_retrieval_without_answer_access
      - teacher_interpretation_of_actual_learner_response
    handback_examples:
      - remove_generated_answer_then_retrieve
      - teacher_reassesses_unmediated_response

  - id: EI-P02
    label: explicit_presentation_in_manageable_steps
    purpose: Introduce new knowledge, strategy or procedure clearly while controlling unnecessary complexity.
    candidate_core_actions:
      teacher_professional:
        - select_content
        - sequence_learning
        - explain
        - regulate_complexity
      learner:
        - attend_to_relevant_information
        - connect_new_and_prior_knowledge
        - form_initial_understanding
    useful_ai_actions:
      - generate_alternative_example
      - reformat_information
      - translate_or_rephrase
      - produce_visual_support
    displacement_risks:
      - Teacher accepts AI-selected content or sequence without professional review.
      - AI adds complexity, detail or alternative explanations that obscure the intended learning step.
    evidence_examples:
      - teacher_can_justify_content_selection_and_sequence
      - learner_can_explain_new_idea_in_own_words
    handback_examples:
      - teacher_reconstructs_sequence_from_goal
      - learner_explains_without_ai_wording

  - id: EI-P03
    label: modelling
    purpose: Make a relevant procedure, strategy, reasoning process or quality standard visible before or during learner performance.
    candidate_core_actions:
      teacher_professional:
        - model_process
        - choose_example
        - verbalise_relevant_decision
        - anticipate_error
      learner:
        - identify_modelled_step
        - connect_step_to_purpose
        - distinguish_example_from_rule
    useful_ai_actions:
      - provide_contrast_case
      - generate_second_example
      - simulate_alternative_path
    displacement_risks:
      - AI-generated modelling replaces teacher judgement about what should be made visible.
      - Learner copies an AI model without reconstructing why the steps work.
    evidence_examples:
      - teacher_identifies_critical_modelled_decisions
      - learner_reconstructs_process_or_explains_step_purpose
    handback_examples:
      - teacher_models_again_from_own_task_analysis
      - learner_completes_partial_model_without_ai

  - id: EI-P04
    label: check_for_understanding
    purpose: Gather interpretable evidence about learner understanding before selecting the next instructional move.
    candidate_core_actions:
      teacher_professional:
        - ask_instructional_question
        - observe_relevant_signal
        - locate_error_or_breakdown
        - interpret_learning_state
        - decide_next_step
      learner:
        - produce_response
        - explain_reasoning
        - expose_uncertainty
    useful_ai_actions:
      - collect_responses
      - cluster_response_patterns
      - flag_possible_error
      - generate_follow_up_question
    displacement_risks:
      - AI clustering is treated as diagnosis.
      - Teacher approval becomes nominal after an AI recommendation.
      - AI-generated learner explanation is mistaken for learner understanding.
    evidence_examples:
      - raw_or_direct_learner_response
      - teacher_reasoned_interpretation
      - learner_explanation_under_probe
    handback_examples:
      - separate_ai_analysis_from_source_responses
      - professional_reassessment
      - learner_reexplains_without_ai

  - id: EI-P05
    label: guided_practice
    purpose: Let the learner perform the new action successfully with temporary support, monitoring and correction.
    candidate_core_actions:
      teacher_professional:
        - select_hint
        - scaffold
        - select_feedback
        - monitor_effect_of_action
        - adjust_support
      learner:
        - choose_or_apply_strategy
        - execute_target_action
        - detect_or_correct_error
        - use_feedback
    useful_ai_actions:
      - ask_question
      - give_hint
      - provide_feedback
      - generate_practice_item
      - provide_example_on_request
    displacement_risks:
      - AI turns a hint into a complete solution.
      - AI feedback rewrites the learner product instead of prompting revision.
      - Support density remains so high that the target learner action is never observed.
    evidence_examples:
      - learner_executes_target_microstructure_with_known_support
      - learner_explains_correction
      - teacher_adjusts_support_from_observed_response
    handback_examples:
      - reduce_support
      - explain_before_continue
      - new_item_same_operation

  - id: EI-P06
    label: move_toward_independence
    purpose: Reduce temporary support and determine whether the learner can continue with increasing responsibility.
    candidate_core_actions:
      teacher_professional:
        - fade_support
        - judge_readiness_for_independence
        - preserve_uncertainty
      learner:
        - independently_reperform
        - monitor_understanding
        - seek_targeted_help_when_needed
    useful_ai_actions:
      - provide_on_demand_hint
      - generate_fresh_item
      - record_attempt
    displacement_risks:
      - Always-available AI assistance makes independence impossible to observe.
      - AI silently intervenes before the learner reaches an impasse.
      - Successful completion is labelled mastery without support-level information.
    evidence_examples:
      - fresh_attempt_with_reduced_support
      - support_level_record
      - learner_initiated_targeted_help_request
    handback_examples:
      - disable_proactive_ai_help
      - remove_answer_access
      - new_item_same_operation

  - id: EI-P07
    label: independent_practice
    purpose: Consolidate and strengthen successful learner execution with support reduced to the level required by the instructional goal.
    candidate_core_actions:
      teacher_professional:
        - select_practice_set
        - monitor_without_unnecessary_intervention
        - interpret_independent_performance
      learner:
        - execute_target_action
        - monitor_result
        - correct_error
        - persist
    useful_ai_actions:
      - generate_equivalent_practice_item
      - record_progress
      - verify_non_target_surface_feature
    displacement_risks:
      - AI performs substantive steps while the activity is still labelled independent.
      - AI correction prevents productive detection and correction of errors by the learner.
    evidence_examples:
      - independent_human_execution
      - learner_error_correction
      - repeated_success_across_items
    handback_examples:
      - rerun_item_without_substantive_ai_support
      - isolate_and_reperform_displaced_microstructure

  - id: EI-P08
    label: review_reflection_and_later_reperformance
    purpose: Strengthen recall, evaluate process and inspect whether learning persists or generalises beyond the supported episode.
    candidate_core_actions:
      teacher_professional:
        - select_review_target
        - interpret_later_evidence
        - adapt_future_practice
      learner:
        - retrieve_prior_learning
        - reflect_on_process
        - demonstrate_retention
        - demonstrate_transfer
    useful_ai_actions:
      - generate_fresh_retrieval_item
      - ask_reflection_question
      - vary_context
    displacement_risks:
      - AI supplies reflection language that hides learner metacognition.
      - AI-generated recall cues make a retention attempt incomparable with earlier evidence.
      - Transfer is claimed when only surface details changed.
    evidence_examples:
      - delayed_human_reperformance
      - learner_specific_reflection
      - performance_in_meaningfully_different_context
    handback_examples:
      - delayed_reperformance
      - transfer_task
      - ai_free_process_reflection

relations:
  - from: EI-P01
    to: EI-P02
    type: may_precede
  - from: EI-P02
    to: EI-P03
    type: may_overlap
  - from: EI-P03
    to: EI-P04
    type: requires_check_before_progression
  - from: EI-P04
    to: EI-P05
    type: may_route_to
  - from: EI-P04
    to: EI-P02
    type: may_route_back_to
  - from: EI-P05
    to: EI-P04
    type: iterates_with
  - from: EI-P05
    to: EI-P06
    type: support_may_fade_toward
  - from: EI-P06
    to: EI-P05
    type: may_return_if_evidence_insufficient
  - from: EI-P06
    to: EI-P07
    type: may_progress_to
  - from: EI-P07
    to: EI-P08
    type: may_be_followed_by

conformance_notes:
  - Process positions are adapter content, not universal EAI Standard phases.
  - Candidate core actions require situation-level confirmation.
  - A conforming implementation records support level when making claims about independent performance.
  - AI action suitability is evaluated at action or microstructure level, not by declaring an entire process position AI-free or AI-safe.
