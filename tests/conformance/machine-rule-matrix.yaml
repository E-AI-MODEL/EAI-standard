standard_version: 0.4.0-candidate
artifact_version: 0.3.0-candidate
status: candidate

purpose: >-
  Coverage contract for canonical rules whose complete normative meaning is currently classified as machine-evaluable. Each machine rule has deterministic positive and negative fixture coverage. Unknown fixtures are required only where explicit unknown information can alter the rule outcome without causing non-conformance.

fixture_source: tests/conformance/machine-rule-fixtures.yaml

machine_rules:
  - rule: EAI-R020
    positive_fixture: MR-R020-POS
    negative_fixture: MR-R020-NEG
    unknown_fixture: not_applicable
  - rule: EAI-R027
    positive_fixture: MR-R027-POS
    negative_fixture: MR-R027-NEG
    unknown_fixture: not_applicable
  - rule: EAI-R028
    positive_fixture: MR-R028-POS
    negative_fixture: MR-R028-NEG
    unknown_fixture: not_applicable
  - rule: EAI-R029
    positive_fixture: MR-R029-POS
    negative_fixture: MR-R029-NEG
    unknown_fixture: not_applicable

coverage:
  machine_rule_count: 4
  positive_covered: 4
  negative_covered: 4
  unknown_required: 0
  unknown_covered: 0
  pending: 0
  matrix_state: green

release_gate:
  authoritative_reference_validator_requires:
    - no_pending_positive_fixture_for_machine_rules
    - no_pending_negative_fixture_for_machine_rules
    - required_unknown_fixtures_present
    - fixtures_schema_valid_or_intentionally_schema_invalid_as_expected
    - expected_diagnostics_resolve_to_canonical_ids
    - every_machine_rule_in_rule_executability_present_exactly_once

notes:
  - This matrix is green for fixture coverage; it does not itself claim that validator software exists or passes the fixtures.
  - EAI-R002 and EAI-R021 retain deterministic structural checks, but their complete normative meaning is hybrid and they are therefore intentionally excluded from the machine-rule count.
  - The shared fixture file may contain structural fixtures for hybrid rules; those fixtures test only the explicitly deterministic fragment and MUST NOT be interpreted as machine authority over the complete rule.
  - Schema-invalid negative fixtures are intentional where the canonical schema itself enforces the normative representation boundary.
  - The future validator must execute this matrix without hidden framework, model, jurisdiction or LLM judgement.
