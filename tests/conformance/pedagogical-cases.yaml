standard_version: 0.4.0-candidate
status: candidate

cases:
  - case: ../../examples/pedagogical/mentor-conversation-valid.yaml
    expected_conformance: conformant
    expected_information_state: complete
    expected_diagnostics: []
    rationale: Direct learner contact, clarification, weighing and professional justification remain human and evidenced while AI only structures notes or offers options.

  - case: ../../examples/pedagogical/ai-mediated-judgement-invalid.yaml
    expected_conformance: non_conformant
    expected_information_state: contains_unknowns
    expected_diagnostics:
      - EAI-D007
      - EAI-D009
      - EAI-D010
    rationale: A professional-judgement claim is presented as established although AI performed material interpretation and recommendation and the human has not re-demonstrated the relevant pedagogical judgement. Several facts required to inspect that judgement also remain unknown.

  - case: ../../examples/pedagogical/incomplete-context-unknown.yaml
    expected_conformance: conformant
    expected_information_state: contains_unknowns
    expected_diagnostics:
      - EAI-D020
    rationale: The learner's own account and the cause of the change remain unknown, but the professional explicitly preserves that uncertainty and limits action to proportionate information gathering.

notes:
  - These cases demonstrate that EAI conformance is not limited to instructional lesson models.
  - Explicitly preserved uncertainty can coexist with either conformance or non-conformance; the two result dimensions must be evaluated independently.
